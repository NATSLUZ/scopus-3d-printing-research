<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Scopus 3D</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #3b82f6;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --white: #ffffff;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; color: #1e293b; }

        /* Menu Lateral */
        nav { width: 260px; background: var(--primary); color: white; padding: 25px; display: flex; flex-direction: column; gap: 10px; }
        nav h2 { font-size: 1.2rem; color: var(--secondary); margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        nav button { 
            background: transparent; border: 1px solid #334155; color: #cbd5e1; 
            padding: 12px; text-align: left; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        nav button:hover { background: var(--secondary); color: white; }
        .btn-import { background: #10b981 !important; border: none !important; margin-top: auto; font-weight: bold; text-align: center !important; }

        /* Área Principal */
        main { flex: 1; padding: 40px; overflow-y: auto; }
        h1 { margin-top: 0; font-size: 1.8rem; }

        /* Estilo da Tabela */
        table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        th { background: #f1f5f9; padding: 15px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); cursor: pointer; }
        tr:hover { background-color: #f8fafc; }
        
        /* Linha de Detalhes (Escondida por padrão) */
        .details-row { display: none; background: #f9fafb; }
        .details-content { padding: 20px; border-left: 4px solid var(--secondary); line-height: 1.6; }
        .details-row.active { display: table-row; }

        .loading { text-align: center; padding: 50px; font-weight: bold; color: var(--secondary); }
        #csv-input { display: none; }
        .badge { background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav>
        <h2>📊 Scopus 3D</h2>
        <button onclick="location.reload()">🏠 Início</button>
        <button onclick="fetchData('artigo', 'titulo')">📑 Artigos</button>
        <button onclick="fetchData('autor', 'nome')">👥 Autores</button>
        <button onclick="fetchData('palavras_chaves', 'palavras_chaves')">🔑 Palavras-Chave</button>
        <button onclick="fetchData('referencia', 'referencia')">📚 Referências</button>
        
        <input type="file" id="csv-input" accept=".csv">
        <button class="btn-import" onclick="document.getElementById('csv-input').click()">📤 Importar CSV</button>
    </nav>

    <main id="main-content">
        <div style="text-align: center; margin-top: 100px;">
            <h1>Portal de Pesquisa Acadêmica</h1>
            <p>Selecione uma tabela no menu para visualizar os dados em formato tabular.</p>
        </div>
    </main>

<script>
    const SUPABASE_URL = 'https://kdtazqmfbnaethrpkshz.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdGF6cW1mYm5hZXRocnBrc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzcwMjUsImV4cCI6MjA5NDIxMzAyNX0.Rd-i2suGjKmaWjBDo9HwFwAaoiOYdQJCNU_NGfgRJ5A'
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    // FUNÇÃO PARA BUSCAR DADOS COM ORDENAÇÃO
    async function fetchData(tableName, orderColumn) {
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loading">⌛ Carregando ${tableName} em ordem alfabética...</div>`;

        const { data, error } = await _supabase
            .from(tableName)
            .select('*')
            .order(orderColumn, { ascending: true });

        if (error) { main.innerHTML = `<h1>Erro</h1><p>${error.message}</p>`; return; }

        let html = `<h1>Tabela: ${tableName} (${data.length} registros)</h1>`;
        html += `<table><thead><tr>`;

        // Cabeçalhos dinâmicos
        if(tableName === 'artigo') html += `<th>Título</th><th>Ano</th><th>Citações</th>`;
        else if(tableName === 'autor') html += `<th>Nome do Autor</th><th>ID</th>`;
        else if(tableName === 'palavras_chaves') html += `<th>Palavra-Chave</th>`;
        else if(tableName === 'referencia') html += `<th>Referência Bibliográfica</th>`;
        
        html += `</tr></thead><tbody>`;

        data.forEach((item, index) => {
            const rowId = `row-${index}`;
            if(tableName === 'artigo') {
                html += `
                <tr onclick="toggleDetails('${rowId}')">
                    <td>${item.titulo}</td>
                    <td><span class="badge">${item.ano}</span></td>
                    <td>${item.qtd_citacao}</td>
                </tr>
                <tr id="${rowId}" class="details-row">
                    <td colspan="3">
                        <div class="details-content">
                            <strong>Resumo:</strong><br>${item.resumo || 'Sem resumo disponível.'}<br><br>
                            <strong>DOI:</strong> ${item.doi || 'N/A'} | <strong>Tipo:</strong> ${item.tipo_documento || 'N/A'}
                        </div>
                    </td>
                </tr>`;
            } else {
                // Outras tabelas apenas listagem simples organizada
                html += `<tr><td>${item.nome || item.palavras_chaves || item.referencia}</td>${item.id ? `<td>${item.id}</td>` : ''}</tr>`;
            }
        });

        html += `</tbody></table>`;
        main.innerHTML = html;
    }

    function toggleDetails(id) {
        const row = document.getElementById(id);
        row.classList.toggle('active');
    }

    // LÓGICA DE IMPORTAÇÃO (Mantida do anterior)
    document.getElementById('csv-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const main = document.getElementById('main-content');
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                let cont = 0;
                for (const row of results.data) {
                    cont++;
                    main.innerHTML = `<div class="loading">🚀 Importando registro ${cont} de ${results.data.length}...</div>`;
                    const { data: art } = await _supabase.from('artigo').insert([{
                        titulo: row["Title"] || row["Document Title"],
                        ano: parseInt(row["Year"]) || 0,
                        qtd_citacao: parseInt(row["Cited by"]) || 0,
                        doi: row["DOI"] || "",
                        resumo: row["Abstract"] || "",
                        tipo_documento: row["Document Type"] || ""
                    }]).select();
                    // ... (resto da lógica de autores/keywords omitida para brevidade, mas você pode manter a do código anterior)
                }
                alert("Importação concluída!");
                fetchData('artigo', 'titulo');
            }
        });
    });
</script>
</body>
</html>
