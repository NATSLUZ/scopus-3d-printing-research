<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Scopus: Impressão 3D</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #0f172a; --secondary: #3b82f6; --accent: #10b981; --bg: #f1f5f9; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; }
        nav { width: 280px; background: var(--primary); color: white; padding: 25px; display: flex; flex-direction: column; gap: 12px; }
        nav h2 { font-size: 1.4rem; color: var(--secondary); border-bottom: 1px solid #334155; padding-bottom: 10px; }
        nav button { background: transparent; border: 1px solid #334155; color: #cbd5e1; padding: 14px; text-align: left; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        nav button:hover { background: var(--secondary); color: white; }
        .btn-import { background: var(--accent) !important; color: white !important; border: none !important; margin-top: auto; font-weight: bold; text-align: center !important; }
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .card { background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 5px solid var(--secondary); }
        .loading { text-align: center; font-weight: bold; color: var(--secondary); padding: 20px; background: white; border-radius: 10px; }
        #csv-input { display: none; }
    </style>
</head>
<body>

    <nav>
        <h2>📊 Scopus 3D</h2>
        <button onclick="location.reload()">🏠 Início</button>
        <button onclick="fetchData('artigo')">📑 Artigos</button>
        <button onclick="fetchData('autor')">👥 Autores</button>
        <button onclick="fetchData('palavras_chaves')">🔑 Palavras-Chave</button>
        <button onclick="fetchData('referencia')">📚 Referências</button>
        
        <input type="file" id="csv-input" accept=".csv">
        <button class="btn-import" onclick="document.getElementById('csv-input').click()">📤 Importar CSV Scopus</button>
    </nav>

    <main id="main-content">
        <div style="text-align: center; margin-top: 100px;">
            <h1>Portal de Pesquisa Acadêmica</h1>
            <p>Selecione uma tabela ou importe um novo CSV do Scopus.</p>
        </div>
    </main>

<script>
    const SUPABASE_URL = 'https://kdtazqmfbnaethrpkshz.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdGF6cW1mYm5hZXRocnBrc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzcwMjUsImV4cCI6MjA5NDIxMzAyNX0.Rd-i2suGjKmaWjBDo9HwFwAaoiOYdQJCNU_NGfgRJ5A'
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    async function fetchData(tableName) {
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loading">⌛ Buscando dados em ${tableName}...</div>`;
        const { data, error } = await _supabase.from(tableName).select('*');
        if (error) { main.innerHTML = `<h1>Erro</h1><p>${error.message}</p>`; return; }
        
        let html = `<h1>Tabela: ${tableName} (Total: ${data.length})</h1><div class="grid">`;
        data.forEach(item => {
            html += `<div class="card">`;
            if(tableName === 'artigo') html += `<h3>${item.titulo}</h3><p>Ano: ${item.ano}</p>`;
            else if(tableName === 'autor') html += `<h3>👤 ${item.nomecompleto || item.nome}</h3>`;
            else if(tableName === 'palavras_chaves') html += `<h3>🔑 ${item.palavras_chaves}</h3>`;
            else if(tableName === 'referencia') html += `<p style="font-size:0.8rem">📚 ${item.referencia}</p>`;
            html += `</div>`;
        });
        html += `</div>`;
        main.innerHTML = html;
    }

    document.getElementById('csv-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const main = document.getElementById('main-content');

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                const total = results.data.length;
                let cont = 0;

                for (const row of results.data) {
                    cont++;
                    main.innerHTML = `<div class="loading">🚀 Importando registro ${cont} de ${total}...<br>Processando Autores e Referências.</div>`;

                    // 1. Inserir Artigo
                    const { data: art } = await _supabase.from('artigo').insert([{
                        titulo: row["Title"] || row["Document Title"],
                        ano: parseInt(row["Year"]) || 0,
                        qtd_citacao: parseInt(row["Cited by"]) || 0,
                        doi: row["DOI"] || "",
                        resumo: row["Abstract"] || "",
                        tipo_documento: row["Document Type"] || ""
                    }]).select();

                    if (art && art[0]) {
                        const artigoId = art[0].id;

                        // 2. Autores
                        const autoresRaw = row["Authors"] || row["Author(s)"] || "";
                        const listaAutores = autoresRaw.split(';').map(a => a.trim()).filter(a => a);
                        for (const nome of listaAutores) {
                            const authId = nome.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase(); 
                            await _supabase.from('autor').upsert([{ id: authId, nome: nome, nomecompleto: nome }]);
                            await _supabase.from('artigo_autor').upsert([{ id_artigo: artigoId, id_autor: authId }]);
                        }

                        // 3. Palavras-Chave
                        const keysRaw = row["Author Keywords"] || "";
                        const listaKeys = keysRaw.split(';').map(k => k.trim()).filter(k => k);
                        for (const p of listaKeys) {
                            const { data: kData } = await _supabase.from('palavras_chaves').upsert([{ palavras_chaves: p }], { onConflict: 'palavras_chaves' }).select();
                            if (kData && kData[0]) await _supabase.from('artigo_palavrachave').upsert([{ id_artigo: artigoId, id_palavrachave: kData[0].id }]);
                        }

                        // 4. Referências (Limitado a 5 por artigo para ser mais rápido)
                        const refsRaw = row["References"] || "";
                        const listaRefs = refsRaw.split(';').map(r => r.trim()).filter(r => r.length > 10).slice(0, 5);
                        for (const r of listaRefs) {
                            const { data: rData } = await _supabase.from('referencia').insert([{ referencia: r }]).select();
                            if (rData && rData[0]) await _supabase.from('artigo_referencia').insert([{ id_artigo: artigoId, id_referencia: rData[0].id }]);
                        }
                    }
                }
                alert("Importação concluída com sucesso!");
                fetchData('artigo'); // Recarrega os dados na tela automaticamente
            }
        });
    });
</script>
</body>
</html>
