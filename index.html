<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Scopus 3D</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #3b82f6;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --white: #ffffff;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; color: #1e293b; }

        /* Menu Lateral */
        nav { width: 260px; background: var(--primary); color: white; padding: 25px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        nav h2 { font-size: 1.2rem; color: var(--secondary); margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        nav button { 
            background: transparent; border: 1px solid #334155; color: #cbd5e1; 
            padding: 12px; text-align: left; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        nav button:hover { background: var(--secondary); color: white; }
        .btn-import { background: #10b981 !important; border: none !important; margin-top: auto; font-weight: bold; text-align: center !important; color: white !important; }

        /* Área Principal */
        main { flex: 1; padding: 40px; overflow-y: auto; }
        h1 { margin-top: 0; font-size: 1.8rem; }

        /* Estilo da Tabela */
        .table-container { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; padding: 15px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); }
        
        .clickable-row { cursor: pointer; transition: 0.2s; }
        .clickable-row:hover { background-color: #f1f5f9; }
        
        /* Linha de Detalhes (Escondida por padrão) */
        .expandable-content { display: none; background: #f9fafb; }
        .expandable-content.active { display: table-row; }
        .details-wrapper { padding: 20px; border-left: 4px solid var(--secondary); line-height: 1.6; }

        .loading { text-align: center; padding: 50px; font-weight: bold; color: var(--secondary); }
        #csv-input { display: none; }
        .badge { background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav>
        <h2>📊 Scopus 3D</h2>
        <button onclick="location.reload()">🏠 Início</button>
        <button onclick="fetchData('artigo', 'titulo')">📑 Artigos</button>
        <button onclick="fetchData('autor', 'nome')">👥 Autores</button>
        <button onclick="fetchData('palavras_chaves', 'palavras_chaves')">🔑 Palavras-Chave</button>
        <button onclick="fetchData('referencia', 'referencia')">📚 Referências</button>
        
        <input type="file" id="csv-input" accept=".csv">
        <button class="btn-import" onclick="document.getElementById('csv-input').click()">📤 Importar CSV</button>
    </nav>

    <main id="main-content">
        <div style="text-align: center; margin-top: 100px;">
            <h1>Portal de Pesquisa Acadêmica</h1>
            <p>Selecione uma tabela no menu para visualizar os dados em formato tabular.</p>
        </div>
    </main>

<script>
    const SUPABASE_URL = 'https://kdtazqmfbnaethrpkshz.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdGF6cW1mYm5hZXRocnBrc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzcwMjUsImV4cCI6MjA5NDIxMzAyNX0.Rd-i2suGjKmaWjBDo9HwFwAaoiOYdQJCNU_NGfgRJ5A'
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    async function fetchData(tableName, orderColumn) {
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loading">⌛ Buscando ${tableName} em ordem alfabética...</div>`;

        const { data, error } = await _supabase
            .from(tableName)
            .select('*')
            .order(orderColumn, { ascending: true });

        if (error) { main.innerHTML = `<h1>Erro</h1><p>${error.message}</p>`; return; }

        let html = `<h1>Tabela: ${tableName} (${data.length} registros)</h1>`;
        html += `<div class="table-container"><table><thead><tr>`;

        if(tableName === 'artigo') {
            html += `<th>Título do Artigo</th><th style="width:100px">Ano</th><th style="width:100px">Citações</th>`;
        } else if(tableName === 'autor') {
            html += `<th>Nome Completo</th><th style="width:120px">ID</th>`;
        } else if(tableName === 'palavras_chaves') {
            html += `<th>Palavra-Chave</th><th style="width:80px">ID</th>`;
        } else if(tableName === 'referencia') {
            html += `<th>Referência Completa</th><th style="width:80px">ID</th>`;
        }

        html += `</tr></thead><tbody>`;

        data.forEach((item, index) => {
            const detailId = `detail-${index}`;
            
            if(tableName === 'artigo') {
                html += `
                <tr class="clickable-row" onclick="toggleRow('${detailId}')">
                    <td><b>${item.titulo}</b></td>
                    <td><span class="badge">${item.ano}</span></td>
                    <td>${item.qtd_citacao || 0}</td>
                </tr>
                <tr id="${detailId}" class="expandable-content">
                    <td colspan="3">
                        <div class="details-wrapper">
                            <h4 style="margin:0">Resumo (Abstract):</h4>
                            <p style="text-align:justify; font-style: italic;">"${item.resumo || 'Nenhum resumo cadastrado.'}"</p>
                            <hr style="border:0.5px solid #eee; margin: 15px 0;">
                            <p><b>DOI:</b> ${item.doi || 'N/A'} | <b>ID do Banco:</b> ${item.id}</p>
                        </div>
                    </td>
                </tr>`;
            } else {
                html += `<tr>
                            <td>${item.nome || item.palavras_chaves || item.referencia}</td>
                            <td style="color: #94a3b8; font-size: 0.8rem;">${item.id}</td>
                         </tr>`;
            }
        });

        html += `</tbody></table></div>`;
        main.innerHTML = html;
    }

    function toggleRow(id) {
        const row = document.getElementById(id);
        // Fecha outras linhas abertas para ficar organizado
        document.querySelectorAll('.expandable-content').forEach(r => {
            if (r.id !== id) r.classList.remove('active');
        });
        row.classList.toggle('active');
    }

    document.getElementById('csv-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const main = document.getElementById('main-content');
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                const total = results.data.length;
                let cont = 0;
                for (const row of results.data) {
                    cont++;
                    main.innerHTML = `<div class="loading">🚀 Importando ${cont} de ${total}...</div>`;
                    
                    const { data: art } = await _supabase.from('artigo').insert([{
                        titulo: row["Title"] || row["Document Title"],
                        ano: parseInt(row["Year"]) || 0,
                        qtd_citacao: parseInt(row["Cited by"]) || 0,
                        doi: row["DOI"] || "",
                        resumo: row["Abstract"] || "",
                        tipo_documento: row["Document Type"] || ""
                    }]).select();

                    if (art && art[0]) {
                        const artigoId = art[0].id;
                        // Autores
                        const autoresRaw = row["Authors"] || row["Author(s)"] || "";
                        const listaAutores = autoresRaw.split(';').map(a => a.trim()).filter(a => a);
                        for (const nome of listaAutores) {
                            const authId = nome.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase(); 
                            await _supabase.from('autor').upsert([{ id: authId, nome: nome, nomecompleto: nome }]);
                            await _supabase.from('artigo_autor').upsert([{ id_artigo: artigoId, id_autor: authId }]);
                        }
                        // Keywords
                        const keysRaw = row["Author Keywords"] || "";
                        const listaKeys = keysRaw.split(';').map(k => k.trim()).filter(k => k);
                        for (const p of listaKeys) {
                            const { data: kData } = await _supabase.from('palavras_chaves').upsert([{ palavras_chaves: p }], { onConflict: 'palavras_chaves' }).select();
                            if (kData && kData[0]) await _supabase.from('artigo_palavrachave').upsert([{ id_artigo: artigoId, id_palavrachave: kData[0].id }]);
                        }
                    }
                }
                alert("Importação concluída!");
                fetchData('artigo', 'titulo');
            }
        });
    });
</script>
</body>
</html>
