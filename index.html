<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Scopus 3D - Layout Blindado</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #0f172a; --secondary: #3b82f6; --bg: #f8fafc; --border: #e2e8f0; --white: #ffffff; --accent: #10b981; }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; color: #1e293b; }
        
        /* Menu Lateral */
        nav { width: 260px; background: var(--primary); color: white; padding: 25px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        nav h2 { font-size: 1.2rem; color: var(--secondary); margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        nav button { background: transparent; border: 1px solid #334155; color: #cbd5e1; padding: 12px; text-align: left; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        nav button:hover { background: var(--secondary); color: white; }
        .btn-import { background: var(--accent) !important; border: none !important; margin-top: auto; font-weight: bold; text-align: center !important; color: white !important; }
        #csv-input { display: none; }

        /* Área de Conteúdo */
        main { flex: 1; padding: 40px; overflow-y: scroll; display: block; }
        
        /* TABELA VIA GRID COM MEDIDAS FIXAS (PARA NÃO MOVER) */
        .grid-table { 
            background: var(--white); 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border: 1px solid var(--border); 
            min-width: 900px; /* Garante que a tabela não esprema demais */
        }
        
        .grid-row { 
            display: grid; 
            /* TITULO flexível (1fr) | RESTO FIXO em pixels para não balançar */
            grid-template-columns: 1fr 70px 80px 100px 90px 110px; 
            gap: 0; 
            align-items: stretch;
            border-bottom: 1px solid var(--border);
        }
        
        .grid-header { background: #f1f5f9; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; position: sticky; top: 0; z-index: 10; }
        .grid-row > div { padding: 15px; display: flex; align-items: center; border-right: 1px solid #f1f5f9; }
        .grid-row > div:last-child { border-right: none; }

        .data-row { cursor: pointer; transition: background 0.2s; }
        .data-row:hover { background-color: #f8fafc; }

        /* ANIMAÇÃO DE EXPANSÃO SUAVE */
        .expandable-panel { 
            grid-column: 1 / -1; /* Ocupa todas as colunas do grid */
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.5s ease-in-out, opacity 0.3s ease; 
            opacity: 0;
            background: #fafbfc;
        }
        
        .expandable-panel.active { 
            max-height: 1200px; /* Abre suavemente */
            opacity: 1;
            border-bottom: 1px solid var(--border);
        }

        .details-content { padding: 30px; border-left: 5px solid var(--secondary); margin: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        /* Estilos Internos */
        .badge-type { background: #e2e8f0; color: #475569; padding: 3px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; }
        .loading-container { display: flex; align-items: center; justify-content: center; min-height: 300px; width: 100%; }
        .loading-box { text-align: center; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--secondary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-web { display: inline-block; background: var(--secondary); color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; margin-top: 20px; font-weight: bold; transition: 0.2s; }
        .btn-web:hover { background: var(--primary); }
    </style>
</head>
<body>

    <nav>
        <h2>📊 Scopus 3D</h2>
        <button onclick="location.reload()">🏠 Início</button>
        <button onclick="fetchData('artigo', 'titulo')">📑 Artigos</button>
        <button onclick="fetchData('autor', 'nome')">👥 Autores</button>
        <button onclick="fetchData('palavras_chaves', 'palavras_chaves')">🔑 Palavras-Chave</button>
        <button onclick="fetchData('referencia', 'referencia')">📚 Referências</button>
        <input type="file" id="csv-input" accept=".csv">
        <button class="btn-import" onclick="document.getElementById('csv-input').click()">📤 Importar CSV</button>
    </nav>

    <main id="main-content">
        <div style="text-align: center; margin-top: 100px;">
            <h1>Dashboard Acadêmico Pro</h1>
            <p>Clique em uma linha para ver os detalhes sem que o layout se mova.</p>
        </div>
    </main>

<script>
    const SUPABASE_URL = 'https://kdtazqmfbnaethrpkshz.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdGF6cW1mYm5hZXRocnBrc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzcwMjUsImV4cCI6MjA5NDIxMzAyNX0.Rd-i2suGjKmaWjBDo9HwFwAaoiOYdQJCNU_NGfgRJ5A'
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    async function fetchData(tableName, orderColumn) {
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loading-container"><div class="loading-box"><div class="spinner"></div>Carregando ${tableName}...</div></div>`;
        
        const { data, error } = await _supabase.from(tableName).select('*').order(orderColumn, { ascending: true });
        if (error) { main.innerHTML = `<h1>Erro</h1><p>${error.message}</p>`; return; }

        let html = `<h1>Tabela: ${tableName} (${data.length})</h1><div class="grid-table">`;
        
        if(tableName === 'artigo') {
            html += `<div class="grid-row grid-header"><div>Título</div><div>Ano</div><div>Citações</div><div>ISSN</div><div>Vol/Iss</div><div>Tipo</div></div>`;
        } else {
            html += `<div class="grid-row grid-header" style="grid-template-columns: 1fr 150px"><div>Descrição</div><div>ID</div></div>`;
        }

        data.forEach((item, index) => {
            const pId = `p-${index}`, cId = `c-${index}`;
            if(tableName === 'artigo') {
                html += `
                <div class="grid-row data-row" onclick="togglePanel('${pId}','artigo','${item.id}','${cId}')">
                    <div style="font-weight:600; line-height: 1.4;">${item.titulo}</div>
                    <div>${item.ano}</div>
                    <div style="font-weight: bold; color: var(--secondary)">${item.qtd_citacao || 0}</div>
                    <div><small>${item.issn || '-'}</small></div>
                    <div><small>${item.volume || '-'}/${item.issue || '-'}</small></div>
                    <div><span class="badge-type">${item.tipo_documento || 'Article'}</span></div>
                    <!-- Painel de Expansão DENTRO da estrutura de grid mas ocupando tudo -->
                    <div id="${pId}" class="expandable-panel"><div class="details-content" id="${cId}"></div></div>
                </div>`;
            } else {
                html += `
                <div class="grid-row data-row" style="grid-template-columns: 1fr 150px" onclick="togglePanel('${pId}','${tableName}','${item.id}','${cId}')">
                    <div>${item.nome || item.palavras_chaves || item.referencia}</div>
                    <div style="color:#94a3b8; font-size:0.8rem">${item.id}</div>
                    <div id="${pId}" class="expandable-panel"><div class="details-content" id="${cId}"></div></div>
                </div>`;
            }
        });
        main.innerHTML = html + `</div>`;
    }

    async function togglePanel(pId, type, id, cId) {
        const panel = document.getElementById(pId), cont = document.getElementById(cId);
        const isOpen = panel.classList.contains('active');
        
        // Fecha outros painéis de forma suave
        document.querySelectorAll('.expandable-panel').forEach(p => {
            if(p.id !== pId) p.classList.remove('active');
        });
        
        if (!isOpen) {
            panel.classList.add('active');
            if(cont.innerHTML === "") {
                cont.innerHTML = "<em>Buscando dados no banco...</em>";
                const { data } = await _supabase.from(type).select('*').eq('id', id).single();
                if (type === 'artigo') {
                    const lk = data.link || (data.doi ? `https://doi.org/${data.doi}` : null);
                    cont.innerHTML = `<h3>Abstract:</h3><p style="line-height:1.7; text-align:justify; color: #475569;">${data.resumo || 'Sem resumo disponível.'}</p>
                                      <strong>DOI:</strong> ${data.doi || 'N/A'} | <strong>Citações:</strong> ${data.qtd_citacao || 0}<br>
                                      ${lk ? `<a href="${lk}" target="_blank" class="btn-web">🌐 Acessar no Scopus</a>` : ''}`;
                } else {
                    let tb = type==='autor'?'artigo_autor':(type==='palavras_chaves'?'artigo_palavrachave':'artigo_referencia');
                    let fl = type==='autor'?'id_autor':(type==='palavras_chaves'?'id_palavrachave':'id_referencia');
                    const { data: rel } = await _supabase.from(tb).select('artigo(titulo, ano, doi, link)').eq(fl, id);
                    cont.innerHTML = `<h3>Artigos Relacionados:</h3>` + (rel?.length ? rel.map(d => `<div style="margin:10px 0; padding:12px; background:#f8fafc; border-radius:8px; border:1px solid #e2e8f0">📄 <a href="${d.artigo.link || (d.artigo.doi ? 'https://doi.org/'+d.artigo.doi : '#')}" target="_blank" style="color:#3b82f6; text-decoration:none; font-weight:bold;">${d.artigo.titulo}</a> (${d.artigo.ano})</div>`).join('') : '<p>Sem conexões.</p>');
                }
            }
        }
    }

    // IMPORTAÇÃO TURBO COM FEEDBACK DE PROGRESSO REAL
    document.getElementById('csv-input').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        const main = document.getElementById('main-content');
        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: async function(results) {
                const total = results.data.length;
                for (let i = 0; i < total; i++) {
                    const row = results.data[i];
                    if (i % 2 === 0) { // Atualiza a tela a cada 2 registros para o contador rodar liso
                        main.innerHTML = `<div class="loading-container"><div class="loading-box"><div class="spinner"></div>🚀 <b>Importando ${i+1} de ${total}</b><br><small>Processando conexões relacionais...</small></div></div>`;
                        await new Promise(r => setTimeout(r, 1));
                    }
                    const { data: art } = await _supabase.from('artigo').insert([{
                        titulo: row["Title"] || row["Document Title"], ano: parseInt(row["Year"]) || 0,
                        qtd_citacao: parseInt(row["Cited by"]) || 0, doi: row["DOI"] || "",
                        link: row["Link"] || "", resumo: row["Abstract"] || "",
                        tipo_documento: row["Document Type"] || "", issn: row["ISSN"] || "",
                        volume: row["Volume"] || "", issue: row["Issue"] || ""
                    }]).select();
                    if (art && art[0]) {
                        const aId = art[0].id, p = [];
                        const auts = (row["Authors"] || row["Author(s)"] || "").split(';').map(s=>s.trim()).filter(s=>s);
                        auts.forEach(n => {
                            const id = n.replace(/[^a-z0-9]/gi,'_').toLowerCase();
                            p.push(_supabase.from('autor').upsert({id, nome:n, nomecompleto:n}));
                            p.push(_supabase.from('artigo_autor').insert({id_artigo:aId, id_autor:id}));
                        });
                        const keys = (row["Author Keywords"] || "").split(';').map(s=>s.trim()).filter(s=>s);
                        keys.forEach(k => {
                            p.push(_supabase.from('palavras_chaves').upsert({palavras_chaves:k}, {onConflict:'palavras_chaves'}).select().then(r => {
                                if(r.data && r.data[0]) return _supabase.from('artigo_palavrachave').insert({id_artigo:aId, id_palavrachave:r.data[0].id});
                            }));
                        });
                        const refs = (row["References"] || "").split(';').map(s=>s.trim()).filter(s=>s.length > 15).slice(0, 5);
                        refs.forEach(r => {
                            p.push(_supabase.from('referencia').insert({referencia:r}).select().then(res => {
                                if(res.data && res.data[0]) return _supabase.from('artigo_referencia').insert({id_artigo:aId, id_referencia:res.data[0].id});
                            }));
                        });
                        await Promise.all(p);
                    }
                }
                alert("Importação Concluída!"); fetchData('artigo', 'titulo');
            }
        });
    });
</script>
</body>
</html>
