<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 3D | Intelligence Analytics</title>
    
    <!-- Design System: Inter Font & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Scripts Core -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6; /* Electric Blue */
            --sidebar: #0f172a; /* Navy Blue */
            --bg-body: #f8fafc; /* Slate Light */
            --white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #10b981; /* Emerald */
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; outline: none; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--text-main); }

        /* --- SIDEBAR NEXUS --- */
        nav { width: 280px; background: var(--sidebar); color: white; padding: 40px 24px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; position: relative; }
        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 50px; }
        .logo-icon { width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .logo-text { font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; }
        .logo-text span { color: var(--primary); }

        nav button {
            background: transparent; border: none; color: #94a3b8; padding: 14px 18px; text-align: left;
            border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 14px; font-weight: 500; transition: var(--transition);
        }
        nav button i { font-size: 1.1rem; opacity: 0.7; }
        nav button:hover { background: rgba(255,255,255,0.05); color: white; }
        nav button.active { background: var(--primary); color: white; box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3); }

        .import-section { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .btn-csv { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: var(--transition); }
        .btn-csv:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* --- ÁREA PRINCIPAL --- */
        main { flex: 1; padding: 50px; overflow-y: auto; position: relative; scroll-behavior: smooth; }
        .page-header { margin-bottom: 40px; animation: slideDown 0.5s ease; }
        .page-header h1 { font-size: 2.4rem; font-weight: 800; margin: 0; color: var(--sidebar); letter-spacing: -1px; }

        /* --- CARDS DE PERFIL E DASHBOARD --- */
        .profile-card { background: var(--white); padding: 40px; border-radius: 24px; box-shadow: var(--shadow-md); border: 1px solid var(--border); max-width: 700px; margin: auto; text-align: center; animation: fadeInUp 0.6s ease; }
        .profile-img { width: 120px; height: 120px; background: var(--primary); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: white; font-weight: 800; }
        .profile-links { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
        .link-btn { padding: 12px 25px; border-radius: 12px; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: var(--transition); }
        .github-btn { background: #333; color: white; }
        .email-btn { background: var(--primary); color: white; }

        /* --- TABELAS E FILTROS --- */
        .filter-bar { background: var(--white); padding: 20px; border-radius: 16px; margin-bottom: 30px; display: flex; gap: 15px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .filter-bar input { flex: 1; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border); background: #f9fafb; font-size: 1rem; }
        .grid-table { background: var(--white); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow-md); min-width: 900px; }
        .grid-row { display: grid; align-items: center; border-bottom: 1px solid #f1f5f9; padding: 18px 25px; }
        .row-artigo { grid-template-columns: 1fr 80px 80px 120px 100px 120px; }
        .row-simples { grid-template-columns: 1fr 150px; }
        .grid-header { background: #f8fafc; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; }

        /* EXPANSÃO */
        .expandable-panel { max-height: 0; overflow: hidden; transition: var(--transition); opacity: 0; background: #fafbfc; }
        .expandable-panel.active { max-height: 1000px; opacity: 1; border-bottom: 2px solid var(--primary); }
        .details-box { padding: 30px; border-left: 6px solid var(--primary); margin: 20px; background: var(--white); border-radius: 12px; box-shadow: var(--shadow-sm); }

        /* LOADING */
        .loader-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-body); z-index: 500; }
        .spinner { width: 50px; height: 50px; border: 5px solid #e2e8f0; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        #csv-input { display: none; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 0.7rem; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin: 40px 0; }
        .pagination button { padding: 10px 16px; border: 1px solid var(--border); background: white; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .pagination button.active { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
<body>

    <nav>
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-project-diagram"></i></div>
            <div class="logo-text">NEXUS<span>3D</span></div>
        </div>
        
        <button onclick="showHome()" id="nav-home" class="active"><i class="fas fa-th-large"></i> Dashboard</button>
        <button onclick="loadSection('artigo', 'titulo')" id="nav-artigo"><i class="fas fa-file-text"></i> Artigos</button>
        <button onclick="loadSection('autor', 'nome')" id="nav-autor"><i class="fas fa-user-friends"></i> Autores</button>
        <button onclick="loadSection('palavras_chaves', 'palavras_chaves')" id="nav-palavras"><i class="fas fa-tags"></i> Palavras-Chave</button>
        <button onclick="loadSection('referencia', 'referencia')" id="nav-referencia"><i class="fas fa-bookmark"></i> Referências</button>
        <button onclick="showAbout()" id="nav-about"><i class="fas fa-user-circle"></i> Sobre o Dev</button>
        
        <div class="import-section">
            <input type="file" id="csv-input" accept=".csv">
            <button class="btn-csv" onclick="document.getElementById('csv-input').click()">
                <i class="fas fa-file-csv"></i> IMPORTAR CSV
            </button>
        </div>
    </nav>

    <main id="main-content">
        <!-- Renderização inicial pela função showHome() no script -->
    </main>

<script>
    const SUPABASE_URL = 'https://kdtazqmfbnaethrpkshz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdGF6cW1mYm5hZXRocnBrc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzcwMjUsImV4cCI6MjA5NDIxMzAyNX0.Rd-i2suGjKmaWjBDo9HwFwAaoiOYdQJCNU_NGfgRJ5A';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allData = [];
    let filteredData = [];
    let currentTable = '';
    let currentPage = 1;
    const pageSize = 15;

    // --- NAVEGAÇÃO ---
    function setActiveNav(id) {
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showHome() {
        setActiveNav('nav-home');
        document.getElementById('main-content').innerHTML = `
            <div class="page-header"><h1>Dashboard Nexus 3D</h1></div>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 20px; animation: fadeInUp 0.8s ease;">
                <div class="profile-card" style="padding:30px">
                    <i class="fas fa-database" style="font-size:2rem; color:var(--primary)"></i>
                    <h2>Conectado</h2><p>Banco de Dados PostgreSQL Ativo</p>
                </div>
                <div class="profile-card" style="padding:30px">
                    <i class="fas fa-microchip" style="font-size:2rem; color:var(--accent)"></i>
                    <h2>Tema</h2><p>Pesquisa em Impressão 3D</p>
                </div>
                <div class="profile-card" style="padding:30px">
                    <i class="fas fa-shield-alt" style="font-size:2rem; color:var(--secondary)"></i>
                    <h2>Segurança</h2><p>Protocolo SSL e Anon Key</p>
                </div>
            </div>`;
    }

    function showAbout() {
        setActiveNav('nav-about');
        document.getElementById('main-content').innerHTML = `
            <div class="page-header"><h1>Desenvolvedor</h1></div>
            <div class="profile-card">
                <div class="profile-img">NL</div>
                <h2 style="font-size:2rem; margin:0">Natan Luz</h2>
                <p style="font-size:1.1rem; color:var(--text-muted); margin-top:10px;">Analista de Dados & Desenvolvedor Nexus 3D</p>
                <div class="profile-links">
                    <a href="https://github.com/NATSLUZ" target="_blank" class="link-btn github-btn"><i class="fab fa-github"></i> GitHub</a>
                    <a href="mailto:contato@natanluz.com" class="link-btn email-btn"><i class="fas fa-envelope"></i> E-mail</a>
                </div>
            </div>`;
    }

    // --- EXPLORADOR DE DADOS ---
    async function loadSection(tableName, orderCol) {
        currentTable = tableName; currentPage = 1;
        setActiveNav(tableName === 'artigo' ? 'nav-artigo' : (tableName === 'autor' ? 'nav-autor' : (tableName === 'palavras_chaves' ? 'nav-palavras' : 'nav-referencia')));
        
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Consultando Nexus...</h2></div>`;
        
        const { data, error } = await _supabase.from(tableName).select('*').order(orderCol, { ascending: true }).limit(2000);
        if (error) return main.innerHTML = `<h1>Erro de Conexão</h1>`;
        
        allData = data; filteredData = data;
        renderExplorer();
    }

    function renderExplorer() {
        const main = document.getElementById('main-content');
        const years = [...new Set(allData.map(d => d.ano))].filter(Boolean).sort((a,b) => b-a);
        main.innerHTML = `
            <div class="page-header"><h1>${currentTable.toUpperCase()}</h1><p><b>${allData.length}</b> registros mapeados</p></div>
            <div class="filter-bar">
                <input type="text" id="search-box" placeholder="Pesquisar nos resultados..." oninput="applyFilters()">
                ${currentTable === 'artigo' ? `<select id="filter-year" onchange="applyFilters()"><option value="">Todos os Anos</option>${years.map(y => `<option value="${y}">${y}</option>`).join('')}</select>` : ''}
            </div>
            <div id="table-results"></div><div id="pagination-controls"></div>`;
        updateTable();
    }

    function applyFilters() {
        const search = document.getElementById('search-box').value.toLowerCase();
        const year = document.getElementById('filter-year')?.value || '';
        filteredData = allData.filter(d => (d.titulo || d.nome || d.palavras_chaves || d.referencia || "").toLowerCase().includes(search) && (year === '' || String(d.ano) === year));
        currentPage = 1; updateTable();
    }

    function updateTable() {
        const container = document.getElementById('table-results');
        const items = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
        let html = `<div class="grid-table">`;
        if (currentTable === 'artigo') {
            html += `<div class="grid-row row-artigo grid-header"><div>Título</div><div>Ano</div><div>Cits.</div><div>ISSN</div><div>Vol/Iss</div><div>Tipo</div></div>`;
            items.forEach((item, i) => {
                html += `
                <div class="grid-row row-artigo data-row" onclick="togglePanel('p-${i}')">
                    <div style="font-weight:600; white-space:normal">${item.titulo}</div>
                    <div>${item.ano}</div><div style="font-weight:700; color:var(--primary)">${item.qtd_citacao || 0}</div>
                    <div><small>${item.issn || '-'}</small></div><div><small>${item.volume || '-'}/${item.issue || '-'}</small></div>
                    <div><span class="badge">${item.tipo_documento || 'Article'}</span></div>
                </div>
                <div id="p-${i}" class="expandable-panel"><div class="details-box">
                    <h3 style="margin-top:0">Abstract / Resumo</h3><p style="text-align:justify; line-height:1.7; color:#475569;">${item.resumo || 'Sem resumo disponível.'}</p>
                    <hr style="border:0; border-top:1px solid var(--border); margin:20px 0">
                    <p><b>DOI:</b> ${item.doi || 'N/A'}</p>
                    <a href="${item.link || 'https://doi.org/'+item.doi}" target="_blank" class="btn-web"><i class="fas fa-external-link-alt"></i> VER NO SCOPUS</a>
                </div></div>`;
            });
        } else {
            html += `<div class="grid-row row-simples grid-header"><div>Descrição</div><div>ID Nexus</div></div>`;
            items.forEach(item => {
                html += `<div class="grid-row row-simples data-row"><div>${item.nome || item.palavras_chaves || item.referencia}</div><div style="color:var(--text-muted); font-size:0.85rem">#${item.id}</div></div>`;
            });
        }
        container.innerHTML = html + `</div>`;
        renderPagination();
    }

    function renderPagination() {
        const controls = document.getElementById('pagination-controls');
        const totalPages = Math.ceil(filteredData.length / pageSize);
        if (totalPages <= 1) return controls.innerHTML = '';
        let html = `<div class="pagination">`;
        for (let i = 1; i <= totalPages; i++) {
            if (totalPages > 8 && (i > 3 && i < totalPages - 2)) { if (i === 4) html += `<span style="padding:10px">...</span>`; continue; }
            html += `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
        }
        controls.innerHTML = html + `</div>`;
    }

    function changePage(p) { currentPage = p; updateTable(); document.querySelector('main').scrollTop = 0; }

    function togglePanel(id) {
        const p = document.getElementById(id);
        const isActive = p.classList.contains('active');
        document.querySelectorAll('.expandable-panel').forEach(el => el.classList.remove('active'));
        if (!isActive) p.classList.add('active');
    }

    // --- IMPORTADOR CSV (UNIVERSAL) ---
    document.getElementById('csv-input').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Nexus Sync: Mapeando CSV...</h2></div>`;
        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: async function(results) {
                const rows = results.data;
                const artigos = rows.map(r => ({
                    titulo: r["Title"] || r["Document Title"], ano: parseInt(r["Year"]) || 0,
                    qtd_citacao: parseInt(r["Cited by"]) || 0, doi: r["DOI"] || "",
                    link: r["Link"] || "", resumo: r["Abstract"] || "",
                    tipo_documento: r["Document Type"] || "", issn: r["ISSN"] || "",
                    volume: r["Volume"] || "", issue: r["Issue"] || ""
                }));
                await _supabase.from('artigo').insert(artigos);

                let autSet = new Set(), keySet = new Set(), refSet = new Set();
                rows.forEach(r => {
                    (r["Authors"] || r["Author(s)"] || "").split(';').forEach(a => { if(a.trim()) autSet.add(a.trim()) });
                    (r["Author Keywords"] || "").split(';').forEach(k => { if(k.trim()) keySet.add(k.trim()) });
                    (r["References"] || "").split(';').forEach(ref => { if(ref.trim().length > 30) refSet.add(ref.trim()) });
                });

                await _supabase.from('autor').upsert([...autSet].map(n => ({ id: n.replace(/[^a-z0-9]/gi,'_').toLowerCase(), nome: n, nomecompleto: n })));
                await _supabase.from('palavras_chaves').upsert([...keySet].map(k => ({ palavras_chaves: k })), { onConflict: 'palavras_chaves' });
                
                const refsArray = [...refSet];
                for (let i = 0; i < refsArray.length; i += 50) {
                    await _supabase.from('referencia').insert(refsArray.slice(i, i + 50).map(r => ({ referencia: r })));
                }
                alert("Nexus Sync: Concluído!"); loadSection('artigo', 'titulo');
            }
        });
    });

    // Iniciar na Home
    showHome();
</script>
</body>
</html>
