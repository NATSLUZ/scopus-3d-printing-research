<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Scopus 3D Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #0f172a; --secondary: #3b82f6; --bg: #f8fafc; --border: #e2e8f0; --white: #ffffff; --accent: #10b981; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; color: #1e293b; }
        nav { width: 260px; background: var(--primary); color: white; padding: 25px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        nav h2 { font-size: 1.2rem; color: var(--secondary); margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        nav button { background: transparent; border: 1px solid #334155; color: #cbd5e1; padding: 12px; text-align: left; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        nav button:hover { background: var(--secondary); color: white; }
        .btn-import { background: var(--accent) !important; border: none !important; margin-top: auto; font-weight: bold; text-align: center !important; color: white !important; }
        #csv-input { display: none; }
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .table-container { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; border-bottom: 2px solid var(--border); color: #64748b; }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .clickable-row { cursor: pointer; transition: 0.2s; }
        .clickable-row:hover { background-color: #f1f5f9; }
        .expandable-content { display: none; background: #f9fafb; }
        .expandable-content.active { display: table-row; }
        .details-wrapper { padding: 20px; border-left: 4px solid var(--secondary); background: #fff; }
        .badge-type { background: #f1f5f9; color: #475569; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; border: 1px solid #e2e8f0; }
        .related-item { margin: 5px 0; padding: 10px; background: #fff; border: 1px solid #eee; border-radius: 6px; font-size: 0.85rem; }
        .btn-web { display: inline-block; background: var(--secondary); color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 0.8rem; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <h2>📊 Scopus 3D</h2>
        <button onclick="location.reload()">🏠 Início</button>
        <button onclick="fetchData('artigo', 'titulo')">📑 Artigos</button>
        <button onclick="fetchData('autor', 'nome')">👥 Autores</button>
        <button onclick="fetchData('palavras_chaves', 'palavras_chaves')">🔑 Palavras-Chave</button>
        <button onclick="fetchData('referencia', 'referencia')">📚 Referências</button>
        <input type="file" id="csv-input" accept=".csv">
        <button class="btn-import" onclick="document.getElementById('csv-input').click()">📤 Importar CSV</button>
    </nav>

    <main id="main-content">
        <div style="text-align: center; margin-top: 100px;">
            <h1>Dashboard Acadêmico Completo</h1>
            <p>Os dados agora incluem ISSN, Volume, Issue e Tipo de Documento.</p>
        </div>
    </main>

<script>
    const SUPABASE_URL = 'https://kdtazqmfbnaethrpkshz.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdGF6cW1mYm5hZXRocnBrc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzcwMjUsImV4cCI6MjA5NDIxMzAyNX0.Rd-i2suGjKmaWjBDo9HwFwAaoiOYdQJCNU_NGfgRJ5A'
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    async function fetchData(tableName, orderColumn) {
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loading">⌛ Carregando ${tableName}...</div>`;
        const { data, error } = await _supabase.from(tableName).select('*').order(orderColumn, { ascending: true });
        if (error) { main.innerHTML = `<h1>Erro</h1><p>${error.message}</p>`; return; }

        let html = `<h1>Tabela: ${tableName} (${data.length} registros)</h1><div class="table-container"><table><thead><tr>`;
        
        if(tableName === 'artigo') {
            html += `<th>Título</th><th>Ano</th><th>ISSN</th><th>Vol/Iss</th><th>Tipo</th>`;
        } else {
            html += `<th>Descrição</th><th>ID do Banco</th>`;
        }
        html += `</tr></thead><tbody>`;

        data.forEach((item, index) => {
            const detailId = `detail-${index}`;
            const contentId = `content-${index}`;
            
            if(tableName === 'artigo') {
                html += `
                <tr class="clickable-row" onclick="toggleRow('${detailId}', 'artigo', '${item.id}', '${contentId}')">
                    <td style="max-width:400px"><b>${item.titulo}</b></td>
                    <td>${item.ano}</td>
                    <td><small>${item.issn || '-'}</small></td>
                    <td><small>${item.volume || '-'}/${item.issue || '-'}</small></td>
                    <td><span class="badge-type">${item.tipo_documento || 'Article'}</span></td>
                </tr>
                <tr id="${detailId}" class="expandable-content">
                    <td colspan="5"><div class="details-wrapper" id="${contentId}">Carregando conexões...</div></td>
                </tr>`;
            } else {
                html += `
                <tr class="clickable-row" onclick="toggleRow('${detailId}', '${tableName}', '${item.id}', '${contentId}')">
                    <td>${item.nome || item.palavras_chaves || item.referencia}</td>
                    <td style="color:#94a3b8; font-size:0.8rem">${item.id}</td>
                </tr>
                <tr id="${detailId}" class="expandable-content">
                    <td colspan="2"><div class="details-wrapper" id="${contentId}">Carregando conexões...</div></td>
                </tr>`;
            }
        });
        html += `</tbody></table></div>`;
        main.innerHTML = html;
    }

    async function toggleRow(rowId, type, id, contentId) {
        const row = document.getElementById(rowId);
        const container = document.getElementById(contentId);
        if (row.classList.contains('active')) { row.classList.remove('active'); return; }
        document.querySelectorAll('.expandable-content').forEach(r => r.classList.remove('active'));
        row.classList.add('active');
        
        const { data } = await _supabase.from(type).select('*').eq('id', id).single();
        
        if (type === 'artigo') {
            const linkFinal = data.link || (data.doi ? `https://doi.org/${data.doi}` : null);
            container.innerHTML = `<strong>Abstract (Resumo):</strong><br><em>${data.resumo || 'Sem resumo'}</em><br><br>
                                   <strong>DOI:</strong> ${data.doi || 'N/A'} | <strong>Citações:</strong> ${data.qtd_citacao || 0}<br>
                                   ${linkFinal ? `<a href="${linkFinal}" target="_blank" class="btn-web">🌐 Acessar Artigo Completo</a>` : ''}`;
        } else {
            let joinTable = type === 'autor' ? 'artigo_autor' : (type === 'palavras_chaves' ? 'artigo_palavrachave' : 'artigo_referencia');
            let filterCol = type === 'autor' ? 'id_autor' : (type === 'palavras_chaves' ? 'id_palavrachave' : 'id_referencia');
            const { data: related } = await _supabase.from(joinTable).select('artigo(titulo, ano, doi, link)').eq(filterCol, id);
            
            container.innerHTML = `<strong>Artigos relacionados:</strong>` + 
                (related?.length ? related.map(d => `<div class="related-item">
                    📄 <a href="${d.artigo.link || (d.artigo.doi ? 'https://doi.org/'+d.artigo.doi : '#')}" target="_blank" style="color:#3b82f6; text-decoration:none;">${d.artigo.titulo}</a> (${d.artigo.ano})
                </div>`).join('') : '<p>Sem conexões.</p>');
        }
    }

    document.getElementById('csv-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const main = document.getElementById('main-content');
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                const total = results.data.length;
                let cont = 0;
                for (const row of results.data) {
                    cont++;
                    main.innerHTML = `<div class="loading">🚀 Importando ${cont} de ${total}...</div>`;
                    const { data: art } = await _supabase.from('artigo').insert([{
                        titulo: row["Title"] || row["Document Title"],
                        ano: parseInt(row["Year"]) || 0,
                        qtd_citacao: parseInt(row["Cited by"]) || 0,
                        doi: row["DOI"] || "",
                        link: row["Link"] || "",
                        resumo: row["Abstract"] || "",
                        tipo_documento: row["Document Type"] || "",
                        issn: row["ISSN"] || "",
                        volume: row["Volume"] || "",
                        issue: row["Issue"] || ""
                    }]).select();

                    if (art && art[0]) {
                        const artigoId = art[0].id;
                        const autores = (row["Authors"] || row["Author(s)"] || "").split(';').map(a => a.trim()).filter(a => a);
                        for (const nome of autores) {
                            const authId = nome.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase(); 
                            await _supabase.from('autor').upsert([{ id: authId, nome: nome, nomecompleto: nome }]);
                            await _supabase.from('artigo_autor').upsert([{ id_artigo: artigoId, id_autor: authId }]);
                        }
                        const keys = (row["Author Keywords"] || "").split(';').map(k => k.trim()).filter(k => k);
                        for (const p of keys) {
                            const { data: kData } = await _supabase.from('palavras_chaves').upsert([{ palavras_chaves: p }], { onConflict: 'palavras_chaves' }).select();
                            if (kData) await _supabase.from('artigo_palavrachave').upsert([{ id_artigo: artigoId, id_palavrachave: kData[0].id }]);
                        }
                        const refs = (row["References"] || "").split(';').map(r => r.trim()).filter(r => r.length > 10).slice(0, 5);
                        for (const r of refs) {
                            const { data: rData } = await _supabase.from('referencia').insert([{ referencia: r }]).select();
                            if (rData) await _supabase.from('artigo_referencia').insert([{ id_artigo: artigoId, id_referencia: rData[0].id }]);
                        }
                    }
                }
                alert("Importação Concluída com novos campos!");
                fetchData('artigo', 'titulo');
            }
        });
    });
</script>
</body>
</html>
