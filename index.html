<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 3D | Ultimate Analytics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Biblioteca de Mapas de Rede -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <!-- Biblioteca de Nuvem de Palavras -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-wordcloud@4.3.0/dist/chartjs-chart-wordcloud.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6; --sidebar: #0f172a; --bg: #f8fafc; --white: #ffffff;
            --text-main: #1e293b; --text-muted: #64748b; --accent: #10b981;
            --border: #e5e7eb; --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--text-main); }

        nav { width: 280px; background: var(--sidebar); color: white; padding: 35px 20px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.1); z-index: 100; }
        .logo-box { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding: 0 10px; cursor: pointer; }
        .logo-box i { font-size: 1.8rem; color: var(--primary); }
        .logo-box span { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; }

        nav button {
            background: transparent; border: none; color: #94a3b8; padding: 12px 15px; text-align: left;
            border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 500; transition: var(--transition);
        }
        nav button:hover { background: rgba(255,255,255,0.05); color: white; }
        nav button.active { background: var(--primary); color: white; box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4); }

        .btn-import { background: var(--accent) !important; color: white !important; margin-top: auto; justify-content: center; font-weight: 700; }

        main { flex: 1; padding: 40px; overflow-y: auto; position: relative; scroll-behavior: smooth; }
        .header-content { margin-bottom: 35px; }
        .header-content h1 { font-size: 2.2rem; font-weight: 800; color: var(--sidebar); letter-spacing: -1px; }

        /* Estilo para o Mapa de Rede */
        #network-map { height: 600px; background: white; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 20px; }

        .analytics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; margin-bottom: 50px; }
        .chart-card { background: white; padding: 25px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-container { position: relative; height: 320px; width: 100%; }

        .grid-table { background: var(--white); border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); overflow: hidden; min-width: 1000px; }
        .grid-row { display: grid; align-items: center; border-bottom: 1px solid #f1f5f9; padding: 18px 24px; }
        .row-artigo { grid-template-columns: 1fr 70px 80px 110px 90px 110px; }
        .row-simples { grid-template-columns: 1fr 120px; }
        .grid-header { background: #f8fafc; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); }
        .data-row { cursor: pointer; }
        .data-row:hover { background-color: #f1f5f9; }

        .expandable-panel { max-height: 0; overflow: hidden; transition: all 0.5s ease; opacity: 0; background: #fafbfc; }
        .expandable-panel.active { max-height: 1200px; opacity: 1; border-bottom: 3px solid var(--primary); }
        .details-content { padding: 35px; border-left: 8px solid var(--primary); margin: 20px; background: white; border-radius: 16px; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin: 30px 0 60px; }
        .pagination button { padding: 10px 16px; border: 1px solid var(--border); background: white; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .pagination button.active { background: var(--primary); color: white; }

        .loader-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 500; }
        .spinner { width: 60px; height: 60px; border: 6px solid #e2e8f0; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .filter-bar { background: white; padding: 20px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 30px; display: flex; gap: 15px; }
        .filter-bar input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #e5e7eb; outline: none; }
        
        #csv-input { display: none; }
        .btn-web { display: inline-flex; align-items: center; gap: 8px; background: var(--sidebar); color: white; padding: 14px 22px; border-radius: 12px; text-decoration: none; font-size: 0.9rem; margin-top: 20px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-box" onclick="showHome()">
            <i class="fas fa-project-diagram"></i><span>NEXUS 3D</span>
        </div>
        
        <button onclick="showHome()" id="nav-home" class="active"><i class="fas fa-house"></i> Dashboard</button>
        <button onclick="loadAnalytics()" id="nav-charts"><i class="fas fa-chart-line"></i> Analytics</button>
        <button onclick="loadNetworkMap()" id="nav-maps"><i class="fas fa-circle-nodes"></i> Mapas de Rede</button>
        <button onclick="loadSection('artigo', 'titulo')" id="nav-artigo"><i class="fas fa-file-alt"></i> Artigos</button>
        <button onclick="loadSection('autor', 'nome')" id="nav-autor"><i class="fas fa-users"></i> Autores</button>
        <button onclick="loadSection('palavras_chaves', 'palavras_chaves')" id="nav-palavras"><i class="fas fa-tags"></i> Keywords</button>
        <button onclick="loadSection('referencia', 'referencia')" id="nav-referencia"><i class="fas fa-bookmark"></i> Referências</button>
        <button onclick="showAbout()" id="nav-about"><i class="fas fa-id-card"></i> Sobre o Dev</button>
        
        <input type="file" id="csv-input" accept=".csv">
        <button class="btn-import" onclick="document.getElementById('csv-input').click()"><i class="fas fa-file-csv"></i> IMPORTAR CSV</button>
    </nav>

    <main id="main-content"></main>

<script>
    const SUPABASE_URL = 'https://kdtazqmfbnaethrpkshz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdGF6cW1mYm5hZXRocnBrc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzcwMjUsImV4cCI6MjA5NDIxMzAyNX0.Rd-i2suGjKmaWjBDo9HwFwAaoiOYdQJCNU_NGfgRJ5A';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allData = []; let currentTable = ''; let currentPage = 1; const pageSize = 15;

    function setNav(id) { document.querySelectorAll('nav button').forEach(b => b.classList.remove('active')); if(id) document.getElementById(id).classList.add('active'); }

    function showHome() {
        setNav('nav-home');
        document.getElementById('main-content').innerHTML = `
            <div class="header-content"><h1>Nexus 3D Intelligence</h1></div>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 20px; animation: fadeInUp 0.8s ease;">
                <div class="chart-card" style="text-align:center"><i class="fas fa-database" style="font-size:2.5rem; color:var(--primary); margin-bottom:15px"></i><h3>PostgreSQL Cloud</h3><p>Hospedado no Supabase.</p></div>
                <div class="chart-card" style="text-align:center"><i class="fas fa-network-wired" style="font-size:2.5rem; color:var(--accent); margin-bottom:15px"></i><h3>Relacional</h3><p>Mapeamento de coautoria e termos.</p></div>
                <div class="chart-card" style="text-align:center"><i class="fas fa-microchip" style="font-size:2.5rem; color:var(--sidebar); margin-bottom:15px"></i><h3>Impressão 3D</h3><p>Foco acadêmico exclusivo.</p></div>
            </div>`;
    }

    function showAbout() {
        setNav('nav-about');
        document.getElementById('main-content').innerHTML = `
            <div class="header-content"><h1>Desenvolvedor</h1></div>
            <div style="background:white; padding:50px; border-radius:32px; display:flex; gap:40px; align-items:center; max-width:850px; margin:auto; box-shadow: 0 20px 40px rgba(0,0,0,0.05);">
                <img src="natan.jpg" alt="Natan Luz" style="width:240px; height:240px; border-radius:24px; object-fit:cover; border:5px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.1);" onerror="this.src='https://ui-avatars.com/api/?name=Natan+Luz&size=250&background=0f172a&color=fff'">
                <div>
                    <h2>Natan Luz</h2>
                    <p style="color:var(--text-muted); line-height:1.8;">Sou estudante de Engenharia de Software na UNEB e desenvolvedor do <b>NEXUS 3D</b>, uma plataforma criada para organizar, explorar e conectar pesquisas científicas sobre impressão 3D. Tenho interesse em desenvolvimento de software, análise de dados, acessibilidade e tecnologias que facilitam o acesso ao conhecimento.</p>
                    <div style="display:flex; gap:10px; margin-top:20px">
                        <a href="https://github.com/NATSLUZ" target="_blank" class="btn-web" style="background:#24292e"><i class="fab fa-github"></i> GitHub</a>
                        <a href="mailto:contato@natanluz.com" class="btn-web"><i class="fas fa-envelope"></i> Contato</a>
                    </div>
                </div>
            </div>`;
    }

    // --- GRUPO CONCEITUAL E ANALYTICS ---
    async function loadAnalytics() {
        setNav('nav-charts');
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Processando Analytics...</h2></div>`;
        const { data } = await _supabase.from('artigo').select('*');

        main.innerHTML = `
            <div class="header-content"><h1>Intelligence Dashboard</h1></div>
            <div class="analytics-grid">
                <div class="chart-card" style="grid-column: span 2;"><h3><i class="fas fa-cloud"></i> Grupo Conceitual Top 15 (Nuvem de Temas)</h3><div class="chart-container"><canvas id="wordCloud"></canvas></div></div>
                <div class="chart-card"><h3>Publicações / Ano</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
                <div class="chart-card"><h3>Top 15 Periódicos</h3><div class="chart-container"><canvas id="c3"></canvas></div></div>
                <div class="chart-card"><h3>Top 20 Autores</h3><div class="chart-container"><canvas id="c4"></canvas></div></div>
                <div class="chart-card"><h3>Acesso Aberto</h3><div class="chart-container"><canvas id="c6"></canvas></div></div>
            </div>`;

        const yrs={}, journals={}, auts={}, keys={};
        data.forEach(d => {
            if(d.ano) yrs[d.ano] = (yrs[d.ano] || 0) + 1;
            if(d.source_title) journals[d.source_title] = (journals[d.source_title] || 0) + 1;
            if(d.autores_raw) d.autores_raw.split(';').forEach(a => { let n=a.trim(); if(n) auts[n] = (auts[n]||0)+1 });
            if(d.keywords_raw) d.keywords_raw.split(';').forEach(k => { let n=k.trim(); if(n.length > 2) keys[n] = (keys[n]||0)+1 });
        });

        const sortY = Object.keys(yrs).sort();
        const topJ = Object.entries(journals).sort((a,b)=>b[1]-a[1]).slice(0,15);
        const topA = Object.entries(auts).sort((a,b)=>b[1]-a[1]).slice(0,20);
        const topK = Object.entries(keys).sort((a,b)=>b[1]-a[1]).slice(0,30); // Usamos 30 para a nuvem ficar cheia

        // Nuvem de Palavras (Grupo Conceitual)
        new Chart(document.getElementById('wordCloud'), {
            type: 'wordCloud',
            data: {
                labels: topK.map(k => k[0]),
                datasets: [{
                    label: 'Frequência',
                    data: topK.map(k => 10 + k[1] * 5), // Escala de tamanho
                    color: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#0f172a']
                }]
            },
            options: { plugins: { legend: { display: false } } }
        });

        const opt = { responsive: true, maintainAspectRatio: false };
        new Chart(document.getElementById('c1'), { type: 'bar', data: { labels: sortY, datasets: [{ label: 'Artigos', data: sortY.map(y=>yrs[y]), backgroundColor: '#3b82f6' }] }, options: opt });
        new Chart(document.getElementById('c3'), { type: 'bar', options: { ...opt, indexAxis: 'y' }, data: { labels: topJ.map(x=>x[0].substring(0,25)), datasets: [{ label: 'Artigos', data: topJ.map(x=>x[1]), backgroundColor: '#10b981' }] } });
        new Chart(document.getElementById('c4'), { type: 'bar', data: { labels: topA.map(x=>x[0]), datasets: [{ label: 'Artigos', data: topA.map(x=>x[1]), backgroundColor: '#f59e0b' }] }, options: opt });
    }

    // --- MAPAS DE REDE (VIS.JS) ---
    async function loadNetworkMap() {
        setNav('nav-maps');
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="header-content"><h1>Mapas de Relacionamento</h1><p>Explore as conexões entre autores e temas (Arraste para interagir).</p></div>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button class="btn-web" onclick="generateMap('autores')" style="margin:0">Mapa de Coautoria</button>
                <button class="btn-web" onclick="generateMap('tags')" style="margin:0; background:var(--accent)">Mapa de Termos (Sinônimos)</button>
            </div>
            <div id="network-map"></div>`;
        generateMap('autores');
    }

    async function generateMap(mode) {
        const container = document.getElementById('network-map');
        container.innerHTML = `<div class="loader"><div class="spinner"></div><p>Gerando rede de conexões...</p></div>`;
        
        const { data } = await _supabase.from('artigo').select(mode === 'autores' ? 'autores_raw' : 'keywords_raw').limit(300);
        
        let nodes = [], edges = [], connections = {};
        
        data.forEach(d => {
            let items = (mode === 'autores' ? d.autores_raw : d.keywords_raw).split(';').map(s=>s.trim()).filter(s=>s.length > 2);
            // Criar conexões entre pares
            for(let i=0; i<items.length; i++) {
                for(let j=i+1; j<items.length; j++) {
                    let pair = [items[i], items[j]].sort().join('|');
                    connections[pair] = (connections[pair] || 0) + 1;
                }
            }
        });

        // Filtrar conexões fortes para não travar
        Object.entries(connections).slice(0, 150).forEach(([pair, weight]) => {
            let [from, to] = pair.split('|');
            if(!nodes.find(n => n.id === from)) nodes.push({ id: from, label: from, shape: 'dot', size: 10 });
            if(!nodes.find(n => n.id === to)) nodes.push({ id: to, label: to, shape: 'dot', size: 10 });
            edges.push({ from, to, width: weight });
        });

        container.innerHTML = "";
        new vis.Network(container, { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) }, {
            physics: { enabled: true, barnesHut: { gravitationalConstant: -2000 } },
            nodes: { font: { size: 12, face: 'Inter' }, color: mode === 'autores' ? '#3b82f6' : '#10b981' }
        });
    }

    // --- SEÇÕES DE TABELA (ESTILO APROVADO) ---
    async function loadSection(tableName, orderCol) {
        currentTable = tableName; currentPage = 1;
        setNav('nav-' + tableName.split('_')[0]);
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Consultando Nexus...</h2></div>`;
        const { data } = await _supabase.from(tableName).select('*').order(orderCol, { ascending: true }).limit(2000);
        allData = data; renderTable();
    }

    function renderTable() {
        const main = document.getElementById('main-content');
        main.innerHTML = `<h1>Tabela: ${currentTable} (${allData.length})</h1><div id="results"></div><div id="pag"></div>`;
        const items = allData.slice((currentPage-1)*pageSize, currentPage*pageSize);
        let html = `<div class="grid-table">`;
        if(currentTable === 'artigo') {
            html += `<div class="grid-row row-artigo grid-header"><div>Título</div><div>Ano</div><div>Cits.</div><div>ISSN</div><div>Vol/Iss</div><div>Tipo</div></div>`;
            items.forEach((item, i) => {
                html += `<div class="grid-row row-artigo data-row" onclick="toggle('p-${i}')"><div><b>${item.titulo}</b></div><div>${item.ano}</div><div style="color:var(--primary);font-weight:700">${item.qtd_citacao}</div><div><small>${item.issn||'-'}</small></div><div><small>${item.volume||'-'}/${item.issue||'-'}</small></div><div><span class="badge" style="background:#e0f2fe; color:#0369a1">${item.tipo_documento||'Article'}</span></div></div>
                <div id="p-${i}" class="expandable-panel"><div class="details-content"><h3>Resumo</h3><p>${item.resumo}</p><p><b>DOI:</b> ${item.doi}</p><a href="${item.link || 'https://doi.org/'+item.doi}" target="_blank" class="btn-web">VER NO SCOPUS</a></div></div>`;
            });
        } else {
            html += `<div class="grid-row row-simples grid-header"><div>Descrição</div><div>ID</div></div>`;
            items.forEach(item => { html += `<div class="grid-row row-simples data-row"><div>${item.nome||item.palavras_chaves||item.referencia}</div><div>#${item.id}</div></div>` });
        }
        document.getElementById('results').innerHTML = html + `</div>`;
    }

    function toggle(id) { document.querySelectorAll('.expandable-panel').forEach(e => { if(e.id!==id) e.classList.remove('active') }); document.getElementById(id).classList.toggle('active'); }

    showHome();
</script>
</body>
</html>
