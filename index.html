<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 3D | Intelligence Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #3b82f6; --sidebar: #0f172a; --bg: #f3f4f6; --white: #ffffff; --text: #1e293b; --accent: #10b981; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--text); }
        nav { width: 280px; background: var(--sidebar); color: white; padding: 35px 20px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.1); z-index: 100; }
        .nav-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 45px; padding: 0 10px; font-weight: 800; font-size: 1.3rem; }
        nav button { background: transparent; border: none; color: #94a3b8; padding: 14px 18px; text-align: left; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 500; }
        nav button:hover { background: rgba(255,255,255,0.05); color: white; }
        nav button.active { background: var(--primary); color: white; box-shadow: 0 10px 20px -3px rgba(59, 130, 246, 0.4); }
        .btn-import { background: var(--accent) !important; color: white !important; margin-top: auto; justify-content: center; font-weight: 700; }
        main { flex: 1; padding: 40px; overflow-y: auto; position: relative; }
        .analytics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; margin-bottom: 50px; }
        .chart-card { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-container { position: relative; height: 350px; width: 100%; }
        .grid-table { background: var(--white); border-radius: 24px; border: 1px solid #e5e7eb; overflow: hidden; min-width: 1000px; }
        .grid-row { display: grid; align-items: center; border-bottom: 1px solid #f1f5f9; padding: 18px 25px; }
        .row-artigo { grid-template-columns: 1fr 80px 80px 120px 90px 120px; }
        .row-simples { grid-template-columns: 1fr 150px; }
        .grid-header { background: #f8fafc; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; color: #64748b; }
        .expandable-panel { max-height: 0; overflow: hidden; transition: all 0.5s ease; opacity: 0; background: #fafbfc; }
        .expandable-panel.active { max-height: 1200px; opacity: 1; border-bottom: 3px solid var(--primary); }
        .details-content { padding: 35px; border-left: 8px solid var(--primary); margin: 20px; background: white; border-radius: 16px; }
        .loader-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 500; }
        .spinner { width: 60px; height: 60px; border: 6px solid #e2e8f0; border-top: 6px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .dev-card { background: white; padding: 50px; border-radius: 32px; display: flex; gap: 40px; align-items: center; max-width: 850px; margin: auto; }
        .dev-photo { width: 240px; height: 240px; border-radius: 24px; object-fit: cover; }
        #csv-input { display: none; }
        .btn-web { display: inline-flex; align-items: center; gap: 10px; background: var(--sidebar); color: white; padding: 14px 22px; border-radius: 12px; text-decoration: none; font-size: 0.9rem; margin-top: 20px; font-weight: 700; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo"><i class="fas fa-microchip"></i><span>NEXUS 3D</span></div>
        <button onclick="location.reload()" id="nav-home"><i class="fas fa-house"></i> Dashboard</button>
        <button onclick="loadAnalytics()" id="nav-charts"><i class="fas fa-chart-line"></i> Gráficos</button>
        <button onclick="loadSection('artigo', 'titulo')" id="nav-artigo"><i class="fas fa-file-alt"></i> Artigos</button>
        <button onclick="loadSection('autor', 'nome')" id="nav-autor"><i class="fas fa-users"></i> Autores</button>
        <button onclick="loadSection('palavras_chaves', 'palavras_chaves')" id="nav-palavras"><i class="fas fa-tags"></i> Palavras-Chave</button>
        <button onclick="loadSection('referencia', 'referencia')" id="nav-referencia"><i class="fas fa-bookmark"></i> Referências</button>
        <button onclick="showAbout()" id="nav-about"><i class="fas fa-id-card"></i> Sobre o Dev</button>
        <input type="file" id="csv-input" accept=".csv">
        <button class="btn-import" onclick="document.getElementById('csv-input').click()"><i class="fas fa-file-csv"></i> IMPORTAR CSV</button>
    </nav>
    <main id="main-content">
        <div style="text-align: center; margin: auto;">
            <i class="fas fa-chart-pie" style="font-size: 5rem; color: var(--primary); margin-bottom: 25px; opacity: 0.8;"></i>
            <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 10px;">Nexus 3D Intelligence</h1>
            <p>Selecione uma categoria ao lado para iniciar a análise.</p>
        </div>
    </main>

<script>
    const SUPABASE_URL = 'https://kdtazqmfbnaethrpkshz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdGF6cW1mYm5hZXRocnBrc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzcwMjUsImV4cCI6MjA5NDIxMzAyNX0.Rd-i2suGjKmaWjBDo9HwFwAaoiOYdQJCNU_NGfgRJ5A';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allData = []; let currentTable = ''; let currentPage = 1; const pageSize = 15;

    function setNav(id) { document.querySelectorAll('nav button').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    function showAbout() {
        setNav('nav-about');
        document.getElementById('main-content').innerHTML = `
            <div class="dev-card">
                <img src="natan.jpg" alt="Natan Luz" class="dev-photo" onerror="this.src='https://ui-avatars.com/api/?name=Natan+Luz&size=240&background=0f172a&color=fff'">
                <div>
                    <h2>Natan Luz</h2>
                    <p>Sou estudante de Engenharia de Software na UNEB e desenvolvedor do <b>NEXUS 3D</b>, uma plataforma criada para organizar, explorar e conectar pesquisas científicas sobre impressão 3D.</p>
                    <div style="display:flex; gap:10px; margin-top:20px">
                        <a href="https://github.com/NATSLUZ" target="_blank" class="btn-web" style="background:#24292e"><i class="fab fa-github"></i> GitHub</a>
                        <a href="mailto:natanluz@exemplo.com" class="btn-web"><i class="fas fa-envelope"></i> Contato</a>
                    </div>
                </div>
            </div>`;
    }

    async function loadAnalytics() {
        setNav('nav-charts');
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Gerando Analytics...</h2></div>`;
        const { data } = await _supabase.from('artigo').select('*');

        main.innerHTML = `
            <h1>Analytics Nexus 3D</h1>
            <div class="analytics-grid">
                <div class="chart-card"><h3>Publicações por Ano</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
                <div class="chart-card"><h3>Citações por Ano</h3><div class="chart-container"><canvas id="c2"></canvas></div></div>
                <div class="chart-card"><h3>Top 15 Periódicos</h3><div class="chart-container"><canvas id="c3"></canvas></div></div>
                <div class="chart-card"><h3>Top 20 Autores</h3><div class="chart-container"><canvas id="c4"></canvas></div></div>
                <div class="chart-card"><h3>Top 15 Palavras-Chave</h3><div class="chart-container"><canvas id="c5"></canvas></div></div>
                <div class="chart-card"><h3>Acesso Aberto</h3><div class="chart-container"><canvas id="c6"></canvas></div></div>
                <div class="chart-card"><h3>Idioma</h3><div class="chart-container"><canvas id="c7"></canvas></div></div>
            </div>`;

        const yrs={}, cits={}, journals={}, auts={}, keys={}, acc={}, lang={};
        data.forEach(d => {
            if(d.ano) yrs[d.ano] = (yrs[d.ano] || 0) + 1;
            if(d.ano) cits[d.ano] = (cits[d.ano] || 0) + (d.qtd_citacao || 0);
            if(d.source_title) journals[d.source_title] = (journals[d.source_title] || 0) + 1;
            if(d.autores_raw) d.autores_raw.split(';').forEach(a => { let n=a.trim(); if(n) auts[n] = (auts[n]||0)+1 });
            if(d.keywords_raw) d.keywords_raw.split(';').forEach(k => { let n=k.trim(); if(n) keys[n] = (keys[n]||0)+1 });
            let open = d.tipo_acesso ? (d.tipo_acesso.includes("Open") ? "Acesso Aberto" : "Fechado") : "Não Informado";
            acc[open] = (acc[open]||0)+1;
            let l = d.linguagem || "English"; lang[l] = (lang[l]||0)+1;
        });

        const sortY = Object.keys(yrs).sort();
        const topJ = Object.entries(journals).sort((a,b)=>b[1]-a[1]).slice(0,15);
        const topA = Object.entries(auts).sort((a,b)=>b[1]-a[1]).slice(0,20);
        const topK = Object.entries(keys).sort((a,b)=>b[1]-a[1]).slice(0,15);

        new Chart(document.getElementById('c1'), { type: 'bar', data: { labels: sortY, datasets: [{ label: 'Artigos', data: sortY.map(y=>yrs[y]), backgroundColor: '#3b82f6' }] } });
        new Chart(document.getElementById('c2'), { type: 'line', data: { labels: sortY, datasets: [{ label: 'Citações', data: sortY.map(y=>cits[y]), borderColor: '#6366f1', fill: true, backgroundColor: 'rgba(99,102,241,0.1)' }] } });
        new Chart(document.getElementById('c3'), { type: 'bar', options: { indexAxis: 'y' }, data: { labels: topJ.map(x=>x[0].substring(0,30)), datasets: [{ label: 'Artigos', data: topJ.map(x=>x[1]), backgroundColor: '#10b981' }] } });
        new Chart(document.getElementById('c4'), { type: 'bar', data: { labels: topA.map(x=>x[0]), datasets: [{ label: 'Artigos', data: topA.map(x=>x[1]), backgroundColor: '#f59e0b' }] } });
        new Chart(document.getElementById('c5'), { type: 'pie', data: { labels: topK.map(x=>x[0]), datasets: [{ data: topK.map(x=>x[1]), backgroundColor: ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6'] }] } });
        new Chart(document.getElementById('c6'), { type: 'doughnut', data: { labels: Object.keys(acc), datasets: [{ data: Object.values(acc), backgroundColor: ['#10b981','#ef4444','#64748b'] }] } });
        new Chart(document.getElementById('c7'), { type: 'polarArea', data: { labels: Object.keys(lang), datasets: [{ data: Object.values(lang), backgroundColor: ['#3b82f6','#8b5cf6','#ec4899'] }] } });
    }

    async function loadSection(tableName, orderCol) {
        setNav('nav-' + tableName.split('_')[0]);
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Consultando Nexus...</h2></div>`;
        const { data } = await _supabase.from(tableName).select('*').order(orderCol, { ascending: true }).limit(2000);
        allData = data; renderTable();
    }

    function renderTable() {
        const main = document.getElementById('main-content');
        main.innerHTML = `<h1>Tabela: ${currentTable} (${allData.length})</h1><div id="results"></div><div id="pag"></div>`;
        const items = allData.slice((currentPage-1)*pageSize, currentPage*pageSize);
        let html = `<div class="grid-table">`;
        if(currentTable === 'artigo') {
            html += `<div class="grid-row row-artigo grid-header"><div>Título</div><div>Ano</div><div>Cits.</div><div>ISSN</div><div>Vol/Iss</div><div>Tipo</div></div>`;
            items.forEach((item, i) => {
                html += `<div class="grid-row row-artigo data-row" onclick="toggle('p-${i}')"><div><b>${item.titulo}</b></div><div>${item.ano}</div><div style="color:var(--primary);font-weight:700">${item.qtd_citacao}</div><div><small>${item.issn||'-'}</small></div><div><small>${item.volume||'-'}/${item.issue||'-'}</small></div><div><span class="badge-type">${item.tipo_documento||'Article'}</span></div></div>
                <div id="p-${i}" class="expandable-panel"><div class="details-content"><h3>Resumo</h3><p>${item.resumo}</p><p><b>DOI:</b> ${item.doi}</p><a href="${item.link||'#'}" target="_blank" class="btn-web">VER NO SCOPUS</a></div></div>`;
            });
        } else {
            html += `<div class="grid-row row-simples grid-header"><div>Descrição</div><div>ID</div></div>`;
            items.forEach(item => { html += `<div class="grid-row row-simples data-row"><div>${item.nome||item.palavras_chaves||item.referencia}</div><div>#${item.id}</div></div>` });
        }
        document.getElementById('results').innerHTML = html + `</div>`;
    }

    function toggle(id) { document.querySelectorAll('.expandable-panel').forEach(e => { if(e.id!==id) e.classList.remove('active') }); document.getElementById(id).classList.toggle('active'); }

    document.getElementById('csv-input').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Sincronizando Nexus...</h2></div>`;
        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: async function(results) {
                const artigos = results.data.map(r => ({
                    titulo: r["Title"] || r["Document Title"], ano: parseInt(r["Year"]) || 0,
                    qtd_citacao: parseInt(r["Cited by"]) || 0, doi: r["DOI"] || "",
                    link: r["Link"] || "", resumo: r["Abstract"] || "",
                    tipo_documento: r["Document Type"] || "", issn: r["ISSN"] || "",
                    volume: r["Volume"] || "", issue: r["Issue"] || "",
                    source_title: r["Source title"] || "", tipo_acesso: r["Open Access"] || "",
                    linguagem: r["Language of Original Document"] || "",
                    autores_raw: r["Authors"] || r["Author(s)"] || "",
                    keywords_raw: r["Author Keywords"] || ""
                }));
                await _supabase.from('artigo').insert(artigos);
                let autSet = new Set(), keySet = new Set();
                results.data.forEach(r => {
                    (r["Authors"] || r["Author(s)"] || "").split(';').forEach(a => { if(a.trim()) autSet.add(a.trim()) });
                    (r["Author Keywords"] || "").split(';').forEach(k => { if(k.trim()) keySet.add(k.trim()) });
                });
                await _supabase.from('autor').upsert([...autSet].map(n => ({ id: n.replace(/[^a-z0-9]/gi,'_').toLowerCase(), nome: n, nomecompleto: n })));
                await _supabase.from('palavras_chaves').upsert([...keySet].map(k => ({ palavras_chaves: k })), { onConflict: 'palavras_chaves' });
                alert("Sincronização Concluída!"); loadAnalytics();
            }
        });
    });
    location.hash === "" && showAbout();
</script>
</body>
</html>
