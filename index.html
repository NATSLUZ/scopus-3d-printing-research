<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 3D | Intelligence Analytics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --primary: #0056b3; 
            --sidebar: #0f172a; 
            --bg-body: #f8fafc; 
            --white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #10b981; 
            --border: #e2e8f0;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--text-main); }

        /* --- SIDEBAR --- */
        nav { width: 280px; background: var(--sidebar); color: white; padding: 30px 20px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.1); z-index: 100; }
        
        .logo-container { padding: 10px; margin-bottom: 30px; text-align: center; }
        .logo-container img { width: 100%; max-width: 200px; filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.3)); }

        nav button {
            background: transparent; border: none; color: #94a3b8; padding: 12px 15px; text-align: left;
            border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 500; transition: var(--transition);
        }
        nav button i { width: 20px; font-size: 1.1rem; }
        nav button:hover { background: rgba(255,255,255,0.05); color: white; transform: translateX(5px); }
        nav button.active { background: var(--primary); color: white; box-shadow: 0 10px 15px -3px rgba(0, 86, 179, 0.3); }

        .btn-csv { background: var(--accent) !important; color: white !important; margin-top: auto; justify-content: center; font-weight: 700; border-radius: 12px; }

        /* --- CONTENT --- */
        main { flex: 1; padding: 40px; overflow-y: auto; position: relative; scroll-behavior: smooth; }
        .page-header { margin-bottom: 35px; animation: fadeInDown 0.5s ease; }
        .page-header h1 { font-size: 2rem; font-weight: 800; color: var(--sidebar); letter-spacing: -1px; }

        /* --- ABOUT PAGE --- */
        .about-card { background: white; border-radius: 24px; padding: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); max-width: 850px; margin: 20px auto; display: flex; gap: 40px; align-items: center; animation: fadeInUp 0.7s ease; }
        .about-img { width: 220px; height: 220px; border-radius: 20px; object-fit: cover; box-shadow: 0 15px 25px rgba(0,0,0,0.1); border: 4px solid var(--white); }
        .about-text { flex: 1; }
        .about-text h2 { font-size: 2.2rem; margin: 0 0 10px; color: var(--sidebar); }
        .about-text p { font-size: 1.05rem; line-height: 1.8; color: var(--text-muted); text-align: justify; }
        .social-btns { display: flex; gap: 15px; margin-top: 25px; }
        .social-btns a { padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .git-btn { background: #24292e; color: white; }
        .mail-btn { background: var(--primary); color: white; }
        .social-btns a:hover { transform: translateY(-3px); opacity: 0.9; }

        /* --- TABLES --- */
        .grid-table { background: var(--white); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.03); min-width: 950px; }
        .grid-row { display: grid; align-items: center; border-bottom: 1px solid #f1f5f9; padding: 15px 20px; }
        .row-artigo { grid-template-columns: 1fr 70px 80px 110px 90px 110px; }
        .row-simples { grid-template-columns: 1fr 120px; }
        .grid-header { background: #f8fafc; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); }
        .data-row:hover { background-color: #f1f5f9; cursor: pointer; }
        
        .expandable-panel { max-height: 0; overflow: hidden; transition: all 0.5s ease; opacity: 0; background: #fafbfc; }
        .expandable-panel.active { max-height: 1200px; opacity: 1; border-bottom: 3px solid var(--primary); }
        .details-content { padding: 30px; border-left: 6px solid var(--primary); margin: 20px; background: white; border-radius: 12px; }

        .loader-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-body); z-index: 500; }
        .spinner { width: 50px; height: 50px; border: 5px solid #e2e8f0; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .pagination { display: flex; justify-content: center; gap: 8px; margin: 30px 0 60px; }
        .pagination button { padding: 10px 16px; border: 1px solid var(--border); background: white; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .pagination button.active { background: var(--primary); color: white; border-color: var(--primary); }

        #csv-input { display: none; }
        .btn-web { display: inline-flex; align-items: center; gap: 8px; background: var(--sidebar); color: white; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-size: 0.85rem; margin-top: 15px; font-weight: 700; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-container">
            <img src="logo.png" alt="Nexus 3D Logo">
        </div>
        
        <button onclick="showHome()" id="nav-home" class="active"><i class="fas fa-chart-pie"></i> Dashboard</button>
        <button onclick="loadSection('artigo', 'titulo')" id="nav-artigo"><i class="fas fa-file-alt"></i> Artigos</button>
        <button onclick="loadSection('autor', 'nome')" id="nav-autor"><i class="fas fa-users"></i> Autores</button>
        <button onclick="loadSection('palavras_chaves', 'palavras_chaves')" id="nav-palavras"><i class="fas fa-tags"></i> Palavras-Chave</button>
        <button onclick="loadSection('referencia', 'referencia')" id="nav-referencia"><i class="fas fa-list"></i> Referências</button>
        <button onclick="showAbout()" id="nav-about"><i class="fas fa-user-circle"></i> Sobre o Dev</button>
        
        <input type="file" id="csv-input" accept=".csv">
        <button class="btn-csv" onclick="document.getElementById('csv-input').click()">
            <i class="fas fa-upload"></i> IMPORTAR CSV
        </button>
    </nav>

    <main id="main-content"></main>

<script>
    const SUPABASE_URL = 'https://kdtazqmfbnaethrpkshz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdGF6cW1mYm5hZXRocnBrc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzcwMjUsImV4cCI6MjA5NDIxMzAyNX0.Rd-i2suGjKmaWjBDo9HwFwAaoiOYdQJCNU_NGfgRJ5A';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allData = [];
    let filteredData = [];
    let currentTable = '';
    let currentPage = 1;
    const pageSize = 15;

    function setActive(id) {
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showHome() {
        setActive('nav-home');
        document.getElementById('main-content').innerHTML = `
            <div class="page-header"><h1>Nexus 3D Dashboard</h1></div>
            <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap: 25px; animation: fadeInUp 0.8s ease;">
                <div class="about-card" style="padding:30px; margin:0; width:100%">
                    <div><i class="fas fa-database" style="font-size:3rem; color:var(--primary)"></i></div>
                    <div><h3>Base de Dados Relacional</h3><p>Conectado ao PostgreSQL via Supabase Cloud.</p></div>
                </div>
                <div class="about-card" style="padding:30px; margin:0; width:100%">
                    <div><i class="fas fa-cube" style="font-size:3rem; color:var(--accent)"></i></div>
                    <div><h3>Escopo da Pesquisa</h3><p>Análise avançada de tecnologias e materiais para Impressão 3D.</p></div>
                </div>
            </div>`;
    }

    function showAbout() {
        setActive('nav-about');
        document.getElementById('main-content').innerHTML = `
            <div class="page-header"><h1>Sobre o Desenvolvedor</h1></div>
            <div class="about-card">
                <img src="natan.jpg" alt="Natan Luz" class="about-img" onerror="this.src='https://ui-avatars.com/api/?name=Natan+Luz&background=0056b3&color=fff&size=200'">
                <div class="about-text">
                    <h2>Natan Luz</h2>
                    <p>Sou estudante de Engenharia de Software na UNEB e desenvolvedor do <b>NEXUS 3D</b>, uma plataforma criada para organizar, explorar e conectar pesquisas científicas sobre impressão 3D. Tenho interesse em desenvolvimento de software, análise de dados, acessibilidade e tecnologias que facilitam o acesso ao conhecimento.</p>
                    <div class="social-btns">
                        <a href="https://github.com/NATSLUZ" target="_blank" class="git-btn"><i class="fab fa-github"></i> GitHub</a>
                        <a href="mailto:natanluz@exemplo.com" class="mail-btn"><i class="fas fa-envelope"></i> Contato</a>
                    </div>
                </div>
            </div>`;
    }

    async function loadSection(tableName, orderCol) {
        currentTable = tableName; currentPage = 1;
        setActive(tableName === 'artigo' ? 'nav-artigo' : (tableName === 'autor' ? 'nav-autor' : (tableName === 'palavras_chaves' ? 'nav-palavras' : 'nav-referencia')));
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Sincronizando Nexus...</h2></div>`;
        const { data, error } = await _supabase.from(tableName).select('*').order(orderCol, { ascending: true }).limit(2000);
        allData = data; filteredData = data;
        renderUI();
    }

    function renderUI() {
        const main = document.getElementById('main-content');
        const years = [...new Set(allData.map(d => d.ano))].filter(Boolean).sort((a,b) => b-a);
        main.innerHTML = `
            <div class="page-header"><h1>Tabela: ${currentTable.charAt(0).toUpperCase() + currentTable.slice(1)}</h1><p><b>${allData.length}</b> registros encontrados.</p></div>
            <div class="filter-bar">
                <div style="flex:1; position:relative;"><i class="fas fa-search" style="position:absolute; left:15px; top:15px; color:#94a3b8"></i><input type="text" id="search-box" style="padding-left:45px" placeholder="Pesquisar..." oninput="applyFilters()"></div>
                ${currentTable === 'artigo' ? `<select id="filter-year" onchange="applyFilters()"><option value="">Filtrar Ano</option>${years.map(y => `<option value="${y}">${y}</option>`).join('')}</select>` : ''}
            </div>
            <div id="table-results"></div><div id="pagination-controls"></div>`;
        updateTable();
    }

    function applyFilters() {
        const search = document.getElementById('search-box').value.toLowerCase();
        const year = document.getElementById('filter-year')?.value || '';
        filteredData = allData.filter(d => (d.titulo || d.nome || d.palavras_chaves || d.referencia || "").toLowerCase().includes(search) && (year === '' || String(d.ano) === year));
        currentPage = 1; updateTable();
    }

    function updateTable() {
        const container = document.getElementById('table-results');
        const items = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
        let html = `<div class="grid-table">`;
        if (currentTable === 'artigo') {
            html += `<div class="grid-row row-artigo grid-header"><div>Título</div><div>Ano</div><div>Cits.</div><div>ISSN</div><div>Vol/Iss</div><div>Tipo</div></div>`;
            items.forEach((item, i) => {
                html += `
                <div class="grid-row row-artigo data-row" onclick="togglePanel('p-${i}')">
                    <div style="font-weight:600; white-space:normal">${item.titulo}</div>
                    <div>${item.ano}</div><div style="font-weight:700; color:var(--primary)">${item.qtd_citacao || 0}</div>
                    <div><small>${item.issn || '-'}</small></div><div><small>${item.volume || '-'}/${item.issue || '-'}</small></div>
                    <div><span class="badge">${item.tipo_documento || 'Article'}</span></div>
                </div>
                <div id="p-${i}" class="expandable-panel"><div class="details-box">
                    <h3>Abstract / Resumo</h3><p style="text-align:justify; line-height:1.7; color:#475569;">${item.resumo || 'Sem resumo.'}</p>
                    <hr style="border:0; border-top:1px solid #eee; margin:15px 0">
                    <p><b>DOI:</b> ${item.doi || 'N/A'}</p>
                    <a href="${item.link || 'https://doi.org/'+item.doi}" target="_blank" class="btn-web"><i class="fas fa-external-link-alt"></i> VER NO SCOPUS</a>
                </div></div>`;
            });
        } else {
            html += `<div class="grid-row row-simples grid-header"><div>Descrição</div><div>ID Nexus</div></div>`;
            items.forEach(item => {
                html += `<div class="grid-row row-simples data-row"><div>${item.nome || item.palavras_chaves || item.referencia}</div><div style="color:#94a3b8; font-size:0.85rem">#${item.id}</div></div>`;
            });
        }
        container.innerHTML = html + `</div>`;
        renderPagination();
    }

    function renderPagination() {
        const controls = document.getElementById('pagination-controls');
        const totalPages = Math.ceil(filteredData.length / pageSize);
        if (totalPages <= 1) return controls.innerHTML = '';
        let html = `<div class="pagination">`;
        for (let i = 1; i <= totalPages; i++) {
            if (totalPages > 8 && (i > 3 && i < totalPages - 2)) { if (i === 4) html += `<span style="padding:10px">...</span>`; continue; }
            html += `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
        }
        controls.innerHTML = html + `</div>`;
    }

    function changePage(p) { currentPage = p; updateTable(); document.querySelector('main').scrollTop = 0; }

    function togglePanel(id) {
        const p = document.getElementById(id);
        const isActive = p.classList.contains('active');
        document.querySelectorAll('.expandable-panel').forEach(el => el.classList.remove('active'));
        if (!isActive) p.classList.add('active');
    }

    document.getElementById('csv-input').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Nexus Sync: Processando...</h2></div>`;
        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: async function(results) {
                const rows = results.data;
                const artigos = rows.map(r => ({
                    titulo: r["Title"] || r["Document Title"], ano: parseInt(r["Year"]) || 0,
                    qtd_citacao: parseInt(r["Cited by"]) || 0, doi: r["DOI"] || "",
                    link: r["Link"] || "", resumo: r["Abstract"] || "",
                    tipo_documento: r["Document Type"] || "", issn: r["ISSN"] || "",
                    volume: r["Volume"] || "", issue: r["Issue"] || ""
                }));
                await _supabase.from('artigo').insert(artigos);
                let autSet = new Set(), keySet = new Set();
                rows.forEach(r => {
                    (r["Authors"] || r["Author(s)"] || "").split(';').forEach(a => { if(a.trim()) autSet.add(a.trim()) });
                    (r["Author Keywords"] || "").split(';').forEach(k => { if(k.trim()) keySet.add(k.trim()) });
                });
                await _supabase.from('autor').upsert([...autSet].map(n => ({ id: n.replace(/[^a-z0-9]/gi,'_').toLowerCase(), nome: n, nomecompleto: n })));
                await _supabase.from('palavras_chaves').upsert([...keySet].map(k => ({ palavras_chaves: k })), { onConflict: 'palavras_chaves' });
                alert("Nexus Sync: Concluído!"); loadSection('artigo', 'titulo');
            }
        });
    });

    showHome();
</script>
</body>
</html>
