<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scopus 3D | Intelligence Dashboard</title>
    
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --sidebar: #0f172a;
            --bg: #f3f4f6;
            --white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #10b981;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--text-main); }

        /* --- SIDEBAR PREMIUM --- */
        nav { width: 280px; background: var(--sidebar); color: white; padding: 35px 20px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.1); z-index: 100; }
        .nav-logo { display: flex; align-items: center; gap: 15px; margin-bottom: 45px; padding: 0 10px; }
        .nav-logo i { font-size: 1.8rem; color: var(--primary); text-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .nav-logo span { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; }

        nav button {
            background: transparent; border: none; color: #94a3b8; padding: 14px 18px; text-align: left;
            border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 14px; font-size: 1rem; font-weight: 500; transition: var(--transition);
        }
        nav button i { width: 24px; font-size: 1.2rem; }
        nav button:hover { background: rgba(255,255,255,0.05); color: white; transform: translateX(5px); }
        
        /* Botão Ativo */
        nav button.active { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 10px 20px -3px rgba(59, 130, 246, 0.4); 
            font-weight: 600;
        }

        .btn-import { background: var(--accent) !important; color: white !important; margin-top: auto; justify-content: center; font-weight: 700; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-import:hover { filter: brightness(1.1); transform: scale(1.03) !important; }

        /* --- CONTEÚDO PRINCIPAL --- */
        main { flex: 1; padding: 40px; overflow-y: auto; position: relative; scroll-behavior: smooth; }
        
        /* HEADER */
        .header-content { margin-bottom: 35px; animation: fadeInDown 0.5s ease; }
        .header-content h1 { font-size: 2.2rem; font-weight: 800; margin: 0; color: var(--sidebar); letter-spacing: -1px; }
        .header-content p { color: var(--text-muted); font-size: 1.1rem; margin-top: 8px; }

        /* FILTROS GLASSMORPHISM */
        .filter-bar { 
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 20px; border: 1px solid var(--white); 
            margin-bottom: 30px; display: flex; gap: 15px; align-items: center; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            animation: fadeIn 0.6s ease;
        }
        .search-wrapper { position: relative; flex: 1; }
        .search-wrapper i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .filter-bar input { width: 100%; padding: 14px 15px 14px 50px; border-radius: 12px; border: 1px solid #e5e7eb; background: var(--white); outline: none; font-size: 1rem; transition: var(--transition); }
        .filter-bar select { padding: 14px 18px; border-radius: 12px; border: 1px solid #e5e7eb; background: var(--white); outline: none; min-width: 180px; font-size: 1rem; cursor: pointer; transition: var(--transition); }
        .filter-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

        /* TABELA GRID BLINDADA */
        .grid-table { background: var(--white); border-radius: 24px; border: 1px solid #e5e7eb; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); overflow: hidden; min-width: 1000px; animation: fadeInUp 0.7s ease; }
        .grid-row { display: grid; align-items: center; border-bottom: 1px solid #f1f5f9; }
        .row-artigo { grid-template-columns: 1fr 80px 90px 130px 100px 130px; }
        .row-simples { grid-template-columns: 1fr 150px; }

        .grid-header { background: #f8fafc; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.1em; }
        .grid-row > div { padding: 22px 24px; }

        .data-row { cursor: pointer; transition: background 0.2s ease; }
        .data-row:hover { background-color: #f1f5f9; }
        .data-row .title { font-weight: 600; color: var(--sidebar); line-height: 1.5; font-size: 1rem; }

        /* EXPANSÃO SUAVE */
        .expandable-panel { max-height: 0; overflow: hidden; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; background: #fafbfc; }
        .expandable-panel.active { max-height: 1200px; opacity: 1; border-bottom: 3px solid var(--primary); }
        .details-content { padding: 40px; border-left: 8px solid var(--primary); margin: 25px; background: white; border-radius: 16px; box-shadow: 0 10px 15px rgba(0,0,0,0.05); }

        /* LOADING CENTRALIZADO E BONITO */
        .loading-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 200;
        }
        .spinner {
            width: 60px; height: 60px; border: 6px solid #e5e7eb; border-top: 6px solid var(--primary);
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 25px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { text-align: center; }
        .loading-text h2 { margin: 0; font-size: 1.8rem; font-weight: 800; color: var(--sidebar); }
        .loading-text p { margin: 10px 0 0; color: var(--text-muted); font-size: 1.1rem; }

        /* BOTÕES E PAGINAÇÃO */
        .pagination { display: flex; justify-content: center; gap: 10px; margin: 40px 0 80px; }
        .pagination button { padding: 12px 18px; border: 1px solid #e5e7eb; background: white; border-radius: 12px; cursor: pointer; font-weight: 700; color: var(--text-muted); transition: var(--transition); }
        .pagination button.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 10px 15px rgba(59, 130, 246, 0.3); }

        .btn-web { 
            display: inline-flex; align-items: center; gap: 10px; background: var(--sidebar); color: white; 
            padding: 15px 25px; border-radius: 12px; text-decoration: none; font-size: 0.9rem; margin-top: 25px; font-weight: 700; transition: var(--transition);
        }
        .btn-web:hover { background: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* ANIMATIONS */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #csv-input { display: none; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <i class="fas fa-microchip"></i>
            <span>SCOPUS 3D</span>
        </div>
        
        <button onclick="location.reload()" id="nav-home">
            <i class="fas fa-house"></i> Dashboard
        </button>
        <button onclick="loadSection('artigo', 'titulo')" id="nav-artigo">
            <i class="fas fa-file-lines"></i> Artigos
        </button>
        <button onclick="loadSection('autor', 'nome')" id="nav-autor">
            <i class="fas fa-user-group"></i> Autores
        </button>
        <button onclick="loadSection('palavras_chaves', 'palavras_chaves')" id="nav-palavras">
            <i class="fas fa-tags"></i> Palavras-Chave
        </button>
        <button onclick="loadSection('referencia', 'referencia')" id="nav-referencia">
            <i class="fas fa-book-open"></i> Referências
        </button>
        
        <input type="file" id="csv-input" accept=".csv">
        <button class="btn-import" onclick="document.getElementById('csv-input').click()">
            <i class="fas fa-cloud-arrow-up"></i> IMPORTAR SCOPUS
        </button>
    </nav>

    <main id="main-content">
        <div style="text-align: center; margin: auto; animation: fadeInUp 0.8s ease;">
            <i class="fas fa-chart-pie" style="font-size: 5rem; color: var(--primary); margin-bottom: 25px; opacity: 0.8;"></i>
            <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 10px;">Análise Inteligente Scopus</h1>
            <p style="font-size: 1.2rem; color: var(--text-muted); max-width: 600px; margin: auto;">Plataforma integrada de dados relacionais para pesquisa em Impressão 3D.</p>
        </div>
    </main>

<script>
    const SUPABASE_URL = 'https://kdtazqmfbnaethrpkshz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdGF6cW1mYm5hZXRocnBrc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzcwMjUsImV4cCI6MjA5NDIxMzAyNX0.Rd-i2suGjKmaWjBDo9HwFwAaoiOYdQJCNU_NGfgRJ5A';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allData = [];
    let filteredData = [];
    let currentTable = '';
    let currentPage = 1;
    const pageSize = 15;

    function getLoadingHTML(title, sub) {
        return `
        <div class="loading-wrapper">
            <div class="spinner"></div>
            <div class="loading-text">
                <h2>${title}</h2>
                <p>${sub}</p>
            </div>
        </div>`;
    }

    async function loadSection(tableName, orderCol) {
        currentTable = tableName;
        currentPage = 1;
        
        // Destacar botão ativo
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(tableName === 'artigo' ? 'nav-artigo' : (tableName === 'autor' ? 'nav-autor' : (tableName === 'palavras_chaves' ? 'nav-palavras' : 'nav-referencia')));
        if(activeBtn) activeBtn.classList.add('active');

        const main = document.getElementById('main-content');
        main.innerHTML = getLoadingHTML(`Acessando ${tableName}`, "Consultando banco de dados PostgreSQL...");
        
        const { data, error } = await _supabase.from(tableName).select('*').order(orderCol, { ascending: true }).limit(2000);
        if (error) return main.innerHTML = `<h1>Erro</h1><p>${error.message}</p>`;
        
        allData = data; filteredData = data;
        renderUI();
    }

    function renderUI() {
        const main = document.getElementById('main-content');
        const years = [...new Set(allData.map(d => d.ano))].filter(Boolean).sort((a,b) => b-a);
        
        main.innerHTML = `
            <div class="header-content">
                <h1>Tabela: ${currentTable.charAt(0).toUpperCase() + currentTable.slice(1)}</h1>
                <p>Repositório contém <b>${allData.length}</b> registros processados.</p>
            </div>
            <div class="filter-bar">
                <div class="search-wrapper">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="text" id="search-box" placeholder="Pesquisar nos registros..." oninput="applyFilters()">
                </div>
                ${currentTable === 'artigo' ? `<select id="filter-year" onchange="applyFilters()"><option value="">Filtrar por Ano</option>${years.map(y => `<option value="${y}">${y}</option>`).join('')}</select>` : ''}
            </div>
            <div id="table-container"></div>
            <div id="pagination-controls"></div>`;
        updateTable();
    }

    function applyFilters() {
        const search = document.getElementById('search-box').value.toLowerCase();
        const year = document.getElementById('filter-year')?.value || '';
        filteredData = allData.filter(d => {
            const text = (d.titulo || d.nome || d.palavras_chaves || d.referencia || "").toLowerCase();
            return text.includes(search) && (year === '' || String(d.ano) === year);
        });
        currentPage = 1; updateTable();
    }

    function updateTable() {
        const container = document.getElementById('table-container');
        const start = (currentPage - 1) * pageSize;
        const items = filteredData.slice(start, start + pageSize);
        let html = `<div class="grid-table">`;

        if (currentTable === 'artigo') {
            html += `<div class="grid-row row-artigo grid-header"><div>Título do Artigo</div><div>Ano</div><div>Cits.</div><div>ISSN</div><div>Vol/Iss</div><div>Tipo</div></div>`;
            items.forEach((item, i) => {
                html += `
                <div class="grid-row row-artigo data-row" onclick="togglePanel('p-${i}')">
                    <div><span class="title">${item.titulo}</span></div>
                    <div style="font-weight:600">${item.ano}</div>
                    <div style="font-weight:800; color:var(--primary)">${item.qtd_citacao || 0}</div>
                    <div><small style="color:var(--text-muted); font-weight:500">${item.issn || '-'}</small></div>
                    <div><small>${item.volume || '-'}/${item.issue || '-'}</small></div>
                    <div><span class="badge-type">${item.tipo_documento || 'Article'}</span></div>
                </div>
                <div id="p-${i}" class="expandable-panel">
                    <div class="details-content">
                        <h3 style="margin-top:0"><i class="fas fa-quote-left" style="color:var(--primary)"></i> Abstract / Resumo</h3>
                        <p style="text-align:justify; line-height:1.8; color:#475569; font-size:1rem;">${item.resumo || 'Nenhum abstract disponível para este artigo.'}</p>
                        <hr style="border:0; border-top: 1px solid #eee; margin:25px 0">
                        <div style="display:flex; gap:30px; font-size:0.9rem; color:var(--text-muted)">
                            <span><i class="fas fa-fingerprint"></i> <b>DOI:</b> ${item.doi || 'N/A'}</span>
                            <span><i class="fas fa-award"></i> <b>CITAÇÕES:</b> ${item.qtd_citacao || 0}</span>
                        </div>
                        <a href="${item.link || 'https://doi.org/'+item.doi}" target="_blank" class="btn-web"><i class="fas fa-arrow-up-right-from-square"></i> ACESSAR NO SCOPUS</a>
                    </div>
                </div>`;
            });
        } else {
            html += `<div class="grid-row row-simples grid-header"><div>Descrição Completa</div><div>Identificador</div></div>`;
            items.forEach(item => {
                html += `<div class="grid-row row-simples data-row"><div><span class="title">${item.nome || item.palavras_chaves || item.referencia}</span></div><div style="color:var(--text-muted); font-size:0.85rem; font-weight:600">#${item.id}</div></div>`;
            });
        }
        container.innerHTML = html + `</div>`;
        renderPagination();
    }

    function renderPagination() {
        const controls = document.getElementById('pagination-controls');
        const totalPages = Math.ceil(filteredData.length / pageSize);
        if (totalPages <= 1) return controls.innerHTML = '';
        let html = `<div class="pagination">`;
        for (let i = 1; i <= totalPages; i++) {
            if (totalPages > 8 && (i > 3 && i < totalPages - 2)) { if (i === 4) html += `<span style="padding:10px">...</span>`; continue; }
            html += `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
        }
        controls.innerHTML = html + `</div>`;
    }

    function changePage(p) { currentPage = p; updateTable(); document.querySelector('main').scrollTop = 0; }

    function togglePanel(id) {
        const p = document.getElementById(id);
        const isActive = p.classList.contains('active');
        document.querySelectorAll('.expandable-panel').forEach(el => el.classList.remove('active'));
        if (!isActive) p.classList.add('active');
    }

    // --- IMPORTAÇÃO TURBO COM LOADING CENTRALIZADO ---
    document.getElementById('csv-input').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        const main = document.getElementById('main-content');
        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: async function(results) {
                const rows = results.data;
                main.innerHTML = getLoadingHTML("Sincronizando Banco de Dados", `Processando ${rows.length} registros e gerando vínculos relacionais...`);

                const artigos = rows.map(r => ({
                    titulo: r["Title"] || r["Document Title"], ano: parseInt(r["Year"]) || 0,
                    qtd_citacao: parseInt(r["Cited by"]) || 0, doi: r["DOI"] || "",
                    link: r["Link"] || "", resumo: r["Abstract"] || "",
                    tipo_documento: r["Document Type"] || "", issn: r["ISSN"] || "",
                    volume: r["Volume"] || "", issue: r["Issue"] || ""
                }));
                await _supabase.from('artigo').insert(artigos);

                let autSet = new Set(), keySet = new Set(), refSet = new Set();
                rows.forEach(r => {
                    (r["Authors"] || r["Author(s)"] || "").split(';').forEach(a => { if(a.trim()) autSet.add(a.trim()) });
                    (r["Author Keywords"] || "").split(';').forEach(k => { if(k.trim()) keySet.add(k.trim()) });
                    (r["References"] || "").split(';').forEach(ref => { if(ref.trim().length > 30) refSet.add(ref.trim()) });
                });

                await _supabase.from('autor').upsert([...autSet].map(n => ({ id: n.replace(/[^a-z0-9]/gi,'_').toLowerCase(), nome: n, nomecompleto: n })));
                await _supabase.from('palavras_chaves').upsert([...keySet].map(k => ({ palavras_chaves: k })), { onConflict: 'palavras_chaves' });
                
                const refsArray = [...refSet];
                for (let i = 0; i < refsArray.length; i += 50) {
                    await _supabase.from('referencia').insert(refsArray.slice(i, i + 50).map(r => ({ referencia: r })));
                }

                alert("Sincronização Finalizada!"); loadSection('artigo', 'titulo');
            }
        });
    });
</script>
</body>
</html>
