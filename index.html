<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 3D | Intelligence Analytics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6; --sidebar: #0f172a; --bg: #f3f4f6; --white: #ffffff;
            --text-main: #1e293b; --text-muted: #64748b; --accent: #10b981;
            --border: #e5e7eb; --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--text-main); }

        /* --- SIDEBAR --- */
        nav { width: 280px; background: var(--sidebar); color: white; padding: 35px 20px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.1); z-index: 100; }
        .logo-box { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding: 0 10px; cursor: pointer; }
        .logo-box i { font-size: 1.8rem; color: var(--primary); text-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .logo-box span { font-weight: 800; font-size: 1.3rem; letter-spacing: -1px; }

        nav button {
            background: transparent; border: none; color: #94a3b8; padding: 12px 15px; text-align: left;
            border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 500; transition: var(--transition);
        }
        nav button i { width: 24px; font-size: 1.2rem; }
        nav button:hover { background: rgba(255,255,255,0.05); color: white; }
        nav button.active { background: var(--primary); color: white; box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4); }

        .btn-import { background: var(--accent) !important; color: white !important; margin-top: auto; justify-content: center; font-weight: 700; }

        /* --- CONTENT --- */
        main { flex: 1; padding: 40px; overflow-y: auto; overflow-x: hidden; position: relative; scroll-behavior: smooth; }
        .header-content { margin-bottom: 35px; animation: fadeInDown 0.5s ease; }
        .header-content h1 { font-size: 2.2rem; font-weight: 800; color: var(--sidebar); letter-spacing: -1px; }

        /* --- FILTROS --- */
        .filter-bar { 
            background: white; padding: 15px 25px; border-radius: 18px; border: 1px solid var(--border); 
            margin-bottom: 25px; display: flex; gap: 15px; align-items: center; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); animation: fadeIn 0.5s ease;
        }
        .filter-bar input { flex: 1; padding: 12px 20px; border-radius: 12px; border: 1px solid #e2e8f0; outline: none; transition: 0.3s; }
        .filter-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .filter-bar select { padding: 12px 15px; border-radius: 12px; border: 1px solid #e2e8f0; outline: none; background: white; min-width: 160px; font-weight: 500; }

        /* --- ANALYTICS --- */
        .analytics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; margin-bottom: 50px; width: 100%; }
        .chart-card { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: var(--transition); cursor: pointer; position: relative; width: 100%; min-width: 0; }
        .chart-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(0,0,0,0.1); }
        .chart-card.expanded { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) !important; width: 85vw; height: 80vh; z-index: 2000; cursor: default; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .chart-overlay { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.85); z-index:1999; backdrop-filter: blur(8px); }
        .close-chart { display: none; position: absolute; top: 20px; right: 25px; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; z-index: 2001; transition: 0.2s; }
        .close-chart:hover { color: var(--sidebar); transform: scale(1.1); }
        .chart-card.expanded .close-chart { display: block; }
        .chart-container { position: relative; height: 320px; width: 100%; }

        /* --- TABLES --- */
        .grid-table { background: var(--white); border-radius: 24px; border: 1px solid #e5e7eb; box-shadow: 0 15px 30px rgba(0,0,0,0.05); overflow-x: auto; }
        .grid-row { display: grid; align-items: center; border-bottom: 1px solid #f1f5f9; padding: 18px 24px; min-width: 1000px; }
        .row-artigo { grid-template-columns: 1fr 80px 80px 120px 90px 120px; }
        .row-simples { grid-template-columns: 1fr 120px; }
        .grid-header { background: #f8fafc; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); }
        .data-row { cursor: pointer; transition: 0.2s; }
        .data-row:hover { background-color: #f8fafc; }
        .expandable-panel { max-height: 0; overflow: hidden; transition: var(--transition); opacity: 0; background: #fafbfc; }
        .expandable-panel.active { max-height: 1200px; opacity: 1; border-bottom: 3px solid var(--primary); }
        .details-content { padding: 35px; border-left: 8px solid var(--primary); margin: 20px; background: white; border-radius: 16px; }

        /* --- ABOUT --- */
        .about-card { background: white; padding: 50px; border-radius: 32px; display: flex; gap: 40px; align-items: center; max-width: 900px; margin: 40px auto; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.05); animation: fadeInUp 0.7s ease; }
        .about-img { width: 260px; height: 260px; border-radius: 24px; object-fit: cover; border: 5px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.1); flex-shrink: 0; }
        .about-text h2 { font-size: 2.2rem; margin-top: 0; color: var(--sidebar); font-weight: 800; }
        .about-text p { line-height: 1.8; color: var(--text-muted); font-size: 1.05rem; text-align: justify; }

        /* --- MAPS --- */
        #network-map { width: 100%; height: 600px; background: white; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 20px; position: relative; overflow: hidden; }
        .map-info { background: #eff6ff; padding: 20px; border-radius: 16px; border-left: 5px solid var(--primary); margin-top: 15px; display: none; color: var(--sidebar); animation: fadeIn 0.5s ease; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin: 30px 0 60px; }
        .pagination button { padding: 12px 18px; border: 1px solid #e5e7eb; background: white; border-radius: 12px; cursor: pointer; font-weight: 700; }
        .pagination button.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .btn-web { display: inline-flex; align-items: center; gap: 8px; background: var(--sidebar); color: white; padding: 14px 22px; border-radius: 12px; text-decoration: none; font-weight: 700; cursor: pointer; }
        #csv-input { display: none; }
    </style>
</head>
<body>

    async function loadAnalytics() {
        setNav('nav-charts');
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Gerando Inteligência Nexus...</h2></div>`;
        const { data, error } = await _supabase.from('artigo').select('*');
        if (error) return main.innerHTML = `<h1>Erro ao carregar dados</h1>`;
        
        main.innerHTML = `<div class="header-content"><h1>Nexus Analytics Pro</h1><p>Clique no título de um gráfico para destacar.</p></div>
        <div class="analytics-grid">
            ${createChartCard('c1', 'calendar-alt', '#3b82f6', 'Publicações / Ano')}
            ${createChartCard('chartCits', 'quote-right', '#6366f1', 'Citações / Ano')}
            ${createChartCard('c3', 'book', '#10b981', 'Top 15 Periódicos')}
            ${createChartCard('c4', 'users', '#f59e0b', 'Top 20 Autores')}
            ${createChartCard('c5', 'tags', '#8b5cf6', 'Top 15 Palavras-Chave')}
            ${createChartCard('c6', 'unlock-alt', '#ef4444', 'Acesso Aberto')}
            ${createChartCard('c7', 'language', '#0f172a', 'Idioma')}
        </div>`;

        const yrs={}, cits={}, journals={}, auts={}, keys={}, acc={}, lang={};
        data.forEach(d => {
            if(d.ano) yrs[d.ano] = (yrs[d.ano] || 0) + 1;
            if(d.ano) cits[d.ano] = (cits[d.ano] || 0) + (d.qtd_citacao || 0);
            if(d.source_title) { let j = d.source_title.trim(); journals[j] = (journals[j] || 0) + 1; }
            if(d.autores_raw) d.autores_raw.split(';').forEach(a => { let n = a.trim(); if(n) auts[n] = (auts[n] || 0) + 1; });
            if(d.keywords_raw) d.keywords_raw.split(';').forEach(k => { let n = k.trim(); if(n) keys[n] = (keys[n] || 0) + 1; });
            let open = d.tipo_acesso?.toLowerCase().includes("open") ? "Acesso Aberto" : "Fechado";
            acc[open] = (acc[open] || 0) + 1;
            let l = d.linguagem || "English"; lang[l] = (lang[l] || 0) + 1;
        });

        const sortY = Object.keys(yrs).sort();
        const topJ = Object.entries(journals).sort((a,b) => b[1] - a[1]).slice(0, 15);
        const topA = Object.entries(auts).sort((a,b) => b[1] - a[1]).slice(0, 20);
        const topK = Object.entries(keys).sort((a,b) => b[1] - a[1]).slice(0, 15);
        
        const barOpt = { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: true } }, y: { grid: { display: true } } }, plugins: { legend: { display: true, position: 'bottom' } } };
        const polarOpt = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: 'bottom' } } };

        chartInstances['c3'] = new Chart(document.getElementById('c3'), { type: 'bar', options: { ...barOpt, indexAxis: 'y' }, data: { labels: topJ.map(x => x[0].substring(0,30)), datasets: [{ label: 'Artigos', data: topJ.map(x => x[1]), backgroundColor: '#10b981' }] } });
        chartInstances['chartCits'] = new Chart(document.getElementById('chartCits'), { type: 'line', data: { labels: sortY, datasets: [{ label: 'Citações', data: sortY.map(y=>cits[y]), borderColor: '#6366f1', fill: true, backgroundColor: 'rgba(99, 102, 241, 0.1)' }] }, options: barOpt });
        chartInstances['c1'] = new Chart(document.getElementById('c1'), { type: 'bar', data: { labels: sortY, datasets: [{ label: 'Artigos', data: sortY.map(y=>yrs[y]), backgroundColor: '#3b82f6' }] }, options: barOpt });
        chartInstances['c4'] = new Chart(document.getElementById('c4'), { type: 'bar', data: { labels: topA.map(x=>x[0]), datasets: [{ label: 'Artigos', data: topA.map(x=>x[1]), backgroundColor: '#f59e0b' }] }, options: barOpt });
        chartInstances['c5'] = new Chart(document.getElementById('c5'), { type: 'pie', data: { labels: topK.map(x=>x[0]), datasets: [{ data: topK.map(x=>x[1]), backgroundColor: ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6'] }] }, options: polarOpt });
        chartInstances['c6'] = new Chart(document.getElementById('c6'), { type: 'doughnut', data: { labels: Object.keys(acc), datasets: [{ data: Object.values(acc), backgroundColor: ['#10b981','#ef4444','#64748b'] }] }, options: polarOpt });
        chartInstances['c7'] = new Chart(document.getElementById('c7'), { type: 'polarArea', data: { labels: Object.keys(lang), datasets: [{ data: Object.values(lang), backgroundColor: ['#3b82f6','#8b5cf6','#ec4899','#f97316'] }] }, options: polarOpt });
    }

    function createChartCard(id, icon, color, title) {
        return `<div class="chart-card" id="card-${id}" onclick="expandChart(event, '${id}')">
                    <div class="close-chart" onclick="closeExpandedChart(event)"><i class="fas fa-times"></i></div>
                    <h3><i class="fas fa-${icon}" style="color:${color}"></i> ${title}</h3>
                    <div class="chart-container"><canvas id="${id}"></canvas></div>
                </div>`;
    }

    function expandChart(event, chartId) {
        const card = document.getElementById('card-' + chartId);
        if(card.classList.contains('expanded') || event.target.tagName === 'CANVAS') return;
        document.getElementById('chartOverlay').style.display = 'block';
        card.classList.add('expanded');
        setTimeout(() => { if(chartInstances[chartId]) chartInstances[chartId].resize(); }, 450);
    }

    function closeExpandedChart(event) {
        if(event) event.stopPropagation();
        const expanded = document.querySelector('.chart-card.expanded');
        if(expanded) {
            const canvasId = expanded.querySelector('canvas').id;
            expanded.classList.remove('expanded');
            document.getElementById('chartOverlay').style.display = 'none';
            const canvas = document.getElementById(canvasId);
            canvas.style.width = "100%"; canvas.style.height = "";
            setTimeout(() => { 
                if(chartInstances[canvasId]) {
                    chartInstances[canvasId].resize(); 
                    window.dispatchEvent(new Event('resize'));
                }
            }, 450);
        }
    }

    async function loadNetworkMap() {
        setNav('nav-maps');
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="header-content"><h1>Mapas de Relacionamento</h1><p>Explore conexões acadêmicas.</p></div>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button class="btn-web" onclick="generateMap('autores')" style="margin:0">Mapa de Coautoria</button>
                <button class="btn-web" onclick="generateMap('tags')" style="margin:0; background:var(--accent)">Mapa de Termos</button>
                <button class="btn-web" onclick="generateConceptualMap()" style="margin:0; background:var(--sidebar)">Grupo Conceitual (Top 15)</button>
            </div>
            <div id="map-desc" class="map-info"></div>
            <div id="network-map"></div>`;
        generateMap('autores');

    function showMapDesc(text) {
        const box = document.getElementById('map-desc');
        box.style.display = 'block';
        box.innerHTML = `<i class="fas fa-info-circle"></i> ${text}`;
    }

    async function generateConceptualMap() {
        showMapDesc("<b>Grupo Conceitual (Top 15):</b> Foca nas 15 palavras-chave mais frequentes.");
        const container = document.getElementById('network-map');
        container.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><p>Gerando Rede...</p></div>`;
        const { data } = await _supabase.from('artigo').select('keywords_raw');
        let freq = {};
        data.forEach(d => {
            let keys = (d.keywords_raw || "").split(';').map(s=>s.trim()).filter(s=>s.length > 2);
            keys.forEach(k => freq[k] = (freq[k] || 0) + 1);
        });
        const top15Entries = Object.entries(freq).sort((a,b) => b[1] - a[1]).slice(0, 15);
        const top15Names = top15Entries.map(e => e[0]);
        const maxFreq = Math.max(...top15Entries.map(e => e[1]));
        let nodes = top15Entries.map(e => ({ id: e[0], label: e[0], shape: 'dot', size: 15 + ((e[1] / maxFreq) * 45) }));
        let edges = [], connections = {};
        data.forEach(d => {
            let items = (d.keywords_raw || "").split(';').map(s=>s.trim()).filter(s => top15Names.includes(s));
            for(let i=0; i<items.length; i++) {
                for(let j=i+1; j<items.length; j++) {
                    let pair = [items[i], items[j]].sort().join('|');
                    connections[pair] = (connections[pair] || 0) + 1;
                }
            }
        });
        Object.entries(connections).forEach(([pair, weight]) => {
            let [from, to] = pair.split('|');
            edges.push({ from, to, width: 1, color: '#cbd5e1' });
        });
        container.innerHTML = "";
        const network = new vis.Network(container, { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) }, { physics: { enabled: false }, nodes: { font: { size: 14, weight: '600' }, color: '#f59e0b' } });
        setTimeout(() => network.fit(), 200);
    }

    async function generateMap(mode) {
        showMapDesc(mode === 'autores' ? "<b>Mapa de Coautoria:</b> Rede de colaboração entre autores." : "<b>Mapa de Termos:</b> Co-ocorrência de palavras-chave.");
        const container = document.getElementById('network-map');
        container.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><p>Mapeando...</p></div>`;
        const { data } = await _supabase.from('artigo').select(mode === 'autores' ? 'autores_raw' : 'keywords_raw').limit(300);
        let nodes = [], edges = [], connections = {};
        data.forEach(d => {
            let raw = mode === 'autores' ? d.autores_raw : d.keywords_raw;
            let items = (raw || "").split(';').map(s=>s.trim()).filter(s=>s.length > 2);
            for(let i=0; i<items.length; i++) {
                for(let j=i+1; j<items.length; j++) {
                    let pair = [items[i], items[j]].sort().join('|');
                    connections[pair] = (connections[pair] || 0) + 1;
                }
            }
        });
        Object.entries(connections).slice(0, 100).forEach(([pair, weight]) => {
            let [from, to] = pair.split('|');
            if(!nodes.find(n => n.id === from)) nodes.push({ id: from, label: from, shape: 'dot', size: 10 });
            if(!nodes.find(n => n.id === to)) nodes.push({ id: to, label: to, shape: 'dot', size: 10 });
            edges.push({ from, to, width: weight });
        });
        container.innerHTML = "";
        const network = new vis.Network(container, { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) }, { physics: { enabled: true }, nodes: { font: { size: 12 }, color: mode==='autores'?'#3b82f6':'#10b981' } });
        setTimeout(() => network.fit(), 200);
    }

    async function loadSection(tableName, orderCol) {
        currentTable = tableName; currentPage = 1;
        setNav('nav-' + tableName.split('_')[0]);
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Buscando Dados...</h2></div>`;
        const { data } = await _supabase.from(tableName).select('*').order(orderCol, { ascending: true }).limit(2000);
        allData = data; filteredData = data; renderUI();
    }

    function renderUI() {
        const main = document.getElementById('main-content');
        const years = [...new Set(allData.map(d => d.ano))].filter(Boolean).sort((a,b) => b-a);
        main.innerHTML = `<div class="header-content"><h1>Tabela: ${currentTable} (${allData.length})</h1></div>
            <div class="filter-bar">
                <input type="text" id="search-box" placeholder="Pesquisar..." oninput="applyFilters()">
                ${currentTable === 'artigo' ? `<select id="filter-year" onchange="applyFilters()"><option value="">Todos os Anos</option>${years.map(y => `<option value="${y}">${y}</option>`).join('')}</select>` : ''}
            </div>
            <div id="results"></div><div id="pag"></div>`;
        updateTable();
    }

    function applyFilters() {
        const search = document.getElementById('search-box').value.toLowerCase();
        const year = document.getElementById('filter-year')?.value || '';
        filteredData = allData.filter(d => (d.titulo || d.nome || d.palavras_chaves || d.referencia || "").toLowerCase().includes(search) && (year === '' || String(d.ano) === year));
        currentPage = 1; updateTable();
    }

    function updateTable() {
        const res = document.getElementById('results');
        const items = filteredData.slice((currentPage-1)*pageSize, currentPage*pageSize);
        let html = `<div class="grid-table">`;
        if(currentTable === 'artigo') {
            html += `<div class="grid-row row-artigo grid-header"><div>Título</div><div>Ano</div><div>Cits.</div><div>ISSN</div><div>Vol/Iss</div><div>Tipo</div></div>`;
            items.forEach((item, i) => {
                html += `<div class="grid-row row-artigo data-row" onclick="toggle('p-${i}')"><div><b>${item.titulo}</b></div><div>${item.ano}</div><div style="color:var(--primary);font-weight:800">${item.qtd_citacao}</div><div><small>${item.issn||'-'}</small></div><div><small>${item.volume||'-'}/${item.issue||'-'}</small></div><div><span class="badge" style="background:#e0f2fe; color:#0369a1">${item.tipo_documento||'Article'}</span></div></div>
                <div id="p-${i}" class="expandable-panel">
                    <div class="details-content">
                        <h3><i class="fas fa-quote-left" style="color:var(--primary); margin-right:10px;"></i> Abstract / Resumo</h3>
                        <p style="text-align: justify; line-height: 1.8; color: var(--text-main); margin-bottom: 20px;">${item.resumo}</p>
                        <p><b><i class="fas fa-fingerprint"></i> DOI:</b> ${item.doi}</p>
                        <a href="${item.link || 'https://doi.org/'+item.doi}" target="_blank" class="btn-web">ACESSAR NO SCOPUS</a>
                    </div>
                </div>`;
            });
        } else {
            html += `<div class="grid-row row-simples grid-header"><div>Descrição</div><div>ID</div></div>`;
            items.forEach(item => { html += `<div class="grid-row row-simples data-row"><div>${item.nome||item.palavras_chaves||item.referencia}</div><div>#${item.id}</div></div>` });
        }
        res.innerHTML = html + `</div>`;
        renderPagination();
    }

    function renderPagination() {
        const p = document.getElementById('pag'); const total = Math.ceil(filteredData.length / pageSize); if (total <= 1) return p.innerHTML = '';
        let h = `<div class="pagination">`;
        for (let i = 1; i <= total; i++) {
            if (total > 8 && (i > 3 && i < total - 2)) { if (i === 4) h += `<span>...</span>`; continue; }
            h += `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
        }
        p.innerHTML = h + `</div>`;
    }

    function changePage(page) { currentPage = page; updateTable(); document.querySelector('main').scrollTop = 0; }
    function toggle(id) { document.querySelectorAll('.expandable-panel').forEach(e => { if(e.id!==id) e.classList.remove('active') }); document.getElementById(id).classList.toggle('active'); }

    // --- IMPORTADOR CSV TOTALMENTE RESTAURADO ---
    document.getElementById('csv-input').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader-overlay"><div class="spinner"></div><h2>Sincronizando Nexus Pro...</h2></div>`;
        
        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: async function(results) {
                // 1. Processar Artigos e Idiomas
                const artigos = results.data.map(r => ({
                    titulo: r["Title"] || r["Document Title"], 
                    ano: parseInt(r["Year"]) || 0,
                    qtd_citacao: parseInt(r["Cited by"]) || 0, 
                    doi: r["DOI"] || "",
                    link: r["Link"] || "", 
                    resumo: r["Abstract"] || "",
                    tipo_documento: r["Document Type"] || "", 
                    issn: r["ISSN"] || "",
                    volume: r["Volume"] || "", 
                    issue: r["Issue"] || "",
                    source_title: r["Source title"] || r["Publication Title"] || r["Source Title"] || "", 
                    tipo_acesso: r["Open Access"] || r["Open access"] || "",
                    linguagem: r["Language of Original Document"] || r["Language"] || "English",
                    autores_raw: r["Authors"] || r["Author(s)"] || "",
                    keywords_raw: r["Author Keywords"] || r["Keywords"] || ""
                }));
                await _supabase.from('artigo').insert(artigos);

                // 2. Extrair Autores, Palavras-Chave e Referências para tabelas vinculadas
                let autSet = new Set(), keySet = new Set(), refSet = new Set();
                results.data.forEach(r => {
                    // Autores
                    const autRaw = r["Authors"] || r["Author(s)"] || "";
                    autRaw.split(';').forEach(a => { if(a.trim()) autSet.add(a.trim()) });
                    
                    // Palavras-Chave
                    const keyRaw = r["Author Keywords"] || r["Keywords"] || "";
                    keyRaw.split(';').forEach(k => { if(k.trim()) keySet.add(k.trim()) });
                    
                    // Referências
                    const refRaw = r["References"] || r["references"] || "";
                    refRaw.split(';').forEach(rf => { if(rf.trim().length > 30) refSet.add(rf.trim()) });
                });

                // 3. Upsert nas tabelas relacionais
                if(autSet.size > 0) {
                    await _supabase.from('autor').upsert([...autSet].map(n => ({ 
                        id: n.replace(/[^a-z0-9]/gi,'_').toLowerCase(), 
                        nome: n, 
                        nomecompleto: n 
                    })));
                }

                if(keySet.size > 0) {
                    await _supabase.from('palavras_chaves').upsert([...keySet].map(k => ({ 
                        palavras_chaves: k 
                    })), { onConflict: 'palavras_chaves' });
                }

                if(refSet.size > 0) {
                    const rArr = [...refSet];
                    // Referências são enviadas em lotes para evitar erro de payload do Supabase
                    for (let i = 0; i < rArr.length; i += 50) { 
                        await _supabase.from('referencia').insert(rArr.slice(i, i + 50).map(r => ({ referencia: r }))); 
                    }
                }

                alert("Sincronização Completa com Sucesso!");
                loadAnalytics();
            }
        });
    });

    showHome();
</script>
</body>
</html>
