<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 3D | Analytics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6; 
            --sidebar: #0f172a; 
            --bg-body: #f1f5f9; 
            --white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #10b981; 
            --border: #e2e8f0;
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--text-main); }

        /* --- SIDEBAR DESIGN --- */
        nav { width: 280px; background: var(--sidebar); color: white; padding: 35px 20px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; box-shadow: 5px 0 25px rgba(0,0,0,0.1); z-index: 100; }
        
        /* Nova Logo SVG Integrada */
        .logo-box { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding: 0 10px; cursor: pointer; }
        .logo-box svg { width: 42px; height: 42px; filter: drop-shadow(0 0 8px var(--primary)); }
        .logo-box span { font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; color: white; }
        .logo-box span b { color: var(--primary); }

        nav button {
            background: transparent; border: none; color: #94a3b8; padding: 14px 18px; text-align: left;
            border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 14px; font-size: 1rem; font-weight: 500; transition: var(--transition);
        }
        nav button i { width: 20px; text-align: center; }
        nav button:hover { background: rgba(255,255,255,0.05); color: white; }
        nav button.active { background: var(--primary); color: white; box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3); }

        .import-area { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .btn-csv { width: 100%; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-csv:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* --- CONTEÚDO --- */
        main { flex: 1; padding: 40px; overflow-y: auto; position: relative; }
        .page-title { font-size: 2rem; font-weight: 800; color: var(--sidebar); margin: 0 0 30px; letter-spacing: -1px; }

        /* --- BARRA DE BUSCA E FILTROS (REFEITA) --- */
        .search-container { 
            display: flex; gap: 15px; margin-bottom: 25px; align-items: stretch;
            background: white; padding: 15px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .search-box { position: relative; flex: 1; display: flex; align-items: center; }
        .search-box i { position: absolute; left: 15px; color: var(--text-muted); }
        .search-box input { width: 100%; padding: 12px 15px 12px 45px; border-radius: 10px; border: 1px solid var(--border); background: #f9fafb; font-size: 1rem; outline: none; }
        .search-box input:focus { border-color: var(--primary); background: white; }
        
        .filter-select { padding: 0 15px; border-radius: 10px; border: 1px solid var(--border); background: #f9fafb; font-weight: 600; color: var(--text-main); min-width: 180px; outline: none; }

        /* --- TABELAS GRID --- */
        .nexus-table { background: white; border-radius: 20px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.04); min-width: 950px; }
        .grid-header { background: #f8fafc; display: grid; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; border-bottom: 2px solid var(--border); }
        .grid-item { display: grid; align-items: center; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: background 0.2s; }
        .grid-item:hover { background: #f8fafc; }
        
        /* Layouts de Colunas */
        .cols-artigo { grid-template-columns: 1fr 70px 80px 110px 90px 110px; }
        .cols-simples { grid-template-columns: 1fr 150px; }
        
        .cell { padding: 18px 20px; font-size: 0.95rem; }
        .cell-title { font-weight: 600; color: var(--sidebar); line-height: 1.4; }

        /* EXPANSÃO SUAVE */
        .expand-panel { max-height: 0; overflow: hidden; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; background: #fafbfc; }
        .expand-panel.active { max-height: 1200px; opacity: 1; border-bottom: 2px solid var(--primary); }
        .details-box { padding: 35px; border-left: 6px solid var(--primary); margin: 20px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* PERFIL NATAN LUZ */
        .dev-card { background: white; padding: 50px; border-radius: 30px; max-width: 850px; margin: auto; display: flex; gap: 40px; align-items: center; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .dev-img { width: 240px; height: 240px; border-radius: 25px; object-fit: cover; border: 5px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .dev-info h2 { font-size: 2.5rem; margin: 0; letter-spacing: -1px; }
        .dev-info p { line-height: 1.8; color: var(--text-muted); font-size: 1.1rem; }

        /* UTILS */
        .badge { background: #e0f2fe; color: #0369a1; padding: 5px 10px; border-radius: 6px; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin: 40px 0; }
        .pagination button { padding: 10px 18px; border: 1px solid var(--border); background: white; border-radius: 10px; cursor: pointer; font-weight: 700; }
        .pagination button.active { background: var(--primary); color: white; border-color: var(--primary); }
        .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; position: absolute; background: var(--bg-body); z-index: 500; top: 0; left: 0; }
        .spinner { width: 50px; height: 50px; border: 5px solid #e2e8f0; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-web { display: inline-flex; align-items: center; gap: 8px; background: var(--sidebar); color: white; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-size: 0.85rem; margin-top: 20px; font-weight: 700; }
        #csv-input { display: none; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-box" onclick="location.reload()">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 20L80 80M80 20L20 80" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
                <rect x="35" y="35" width="30" height="30" rx="6" fill="#3b82f6"/>
                <path d="M10 10H30V30H10V10Z" fill="white" fill-opacity="0.2"/>
            </svg>
            <span>NEXUS<b>3D</b></span>
        </div>
        
        <button onclick="showHome()" id="nav-home" class="active"><i class="fas fa-grid-2"></i> Dashboard</button>
        <button onclick="loadSection('artigo', 'titulo')" id="nav-artigo"><i class="fas fa-file-lines"></i> Artigos</button>
        <button onclick="loadSection('autor', 'nome')" id="nav-autor"><i class="fas fa-user-tag"></i> Autores</button>
        <button onclick="loadSection('palavras_chaves', 'palavras_chaves')" id="nav-palavras"><i class="fas fa-hashtag"></i> Keywords</button>
        <button onclick="loadSection('referencia', 'referencia')" id="nav-referencia"><i class="fas fa-quote-right"></i> Referências</button>
        <button onclick="showAbout()" id="nav-about"><i class="fas fa-id-card"></i> Sobre o Dev</button>
        
        <div class="import-area">
            <input type="file" id="csv-input" accept=".csv">
            <button class="btn-csv" onclick="document.getElementById('csv-input').click()">
                <i class="fas fa-file-csv"></i> IMPORTAR CSV
            </button>
        </div>
    </nav>

    <main id="main-content"></main>

<script>
    const SUPABASE_URL = 'https://kdtazqmfbnaethrpkshz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdGF6cW1mYm5hZXRocnBrc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzcwMjUsImV4cCI6MjA5NDIxMzAyNX0.Rd-i2suGjKmaWjBDo9HwFwAaoiOYdQJCNU_NGfgRJ5A';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allData = []; let filteredData = []; let currentTable = ''; let currentPage = 1; const pageSize = 15;

    function setBtn(id) { document.querySelectorAll('nav button').forEach(b => b.classList.remove('active')); if(id) document.getElementById(id).classList.add('active'); }

    function showHome() {
        setBtn('nav-home');
        document.getElementById('main-content').innerHTML = `
            <h1 class="page-title">Bem-vindo ao Nexus 3D</h1>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 20px; animation: fadeInUp 0.5s ease;">
                <div class="details-box" style="margin:0; text-align:center;">
                    <i class="fas fa-database" style="font-size:2.5rem; color:var(--primary); margin-bottom:15px"></i>
                    <h3>PostgreSQL</h3><p>Dados hospedados em nuvem via Supabase.</p>
                </div>
                <div class="details-box" style="margin:0; text-align:center;">
                    <i class="fas fa-link" style="font-size:2.5rem; color:var(--accent); margin-bottom:15px"></i>
                    <h3>Relacional</h3><p>Conexões inteligentes entre autores e temas.</p>
                </div>
                <div class="details-box" style="margin:0; text-align:center;">
                    <i class="fas fa-microchip" style="font-size:2.5rem; color:var(--sidebar); margin-bottom:15px"></i>
                    <h3>Inovação</h3><p>Foco exclusivo em pesquisas de Impressão 3D.</p>
                </div>
            </div>`;
    }

    function showAbout() {
        setBtn('nav-about');
        document.getElementById('main-content').innerHTML = `
            <h1 class="page-title">Desenvolvedor</h1>
            <div class="dev-card" style="animation: fadeInUp 0.6s ease;">
                <img src="natan.jpg" alt="Natan Luz" class="dev-img" onerror="this.src='https://ui-avatars.com/api/?name=Natan+Luz&size=250&background=0f172a&color=fff'">
                <div class="dev-info">
                    <h2>Natan Luz</h2>
                    <p>Sou estudante de Engenharia de Software na UNEB e desenvolvedor do <b>NEXUS 3D</b>, uma plataforma criada para organizar, explorar e conectar pesquisas científicas sobre impressão 3D. Tenho interesse em desenvolvimento de software, análise de dados, acessibilidade e tecnologias que facilitam o acesso ao conhecimento.</p>
                    <div style="display:flex; gap:15px; margin-top:20px">
                        <a href="https://github.com/NATSLUZ" target="_blank" class="btn-web" style="background:#24292e"><i class="fab fa-github"></i> GitHub</a>
                        <a href="mailto:natanluz@exemplo.com" class="btn-web"><i class="fas fa-envelope"></i> E-mail</a>
                    </div>
                </div>
            </div>`;
    }

    async function loadSection(tableName, orderCol) {
        currentTable = tableName; currentPage = 1;
        setBtn(tableName === 'artigo' ? 'nav-artigo' : (tableName === 'autor' ? 'nav-autor' : (tableName === 'palavras_chaves' ? 'nav-palavras' : 'nav-referencia')));
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader"><div class="spinner"></div><h2>Sincronizando Nexus...</h2><p>Acessando banco de dados</p></div>`;
        const { data, error } = await _supabase.from(tableName).select('*').order(orderCol, { ascending: true }).limit(2000);
        allData = data; filteredData = data; renderExplorer();
    }

    function renderExplorer() {
        const main = document.getElementById('main-content');
        const years = [...new Set(allData.map(d => d.ano))].filter(Boolean).sort((a,b) => b-a);
        main.innerHTML = `
            <h1 class="page-title">Explorador: ${currentTable}</h1>
            <div class="search-container">
                <div class="search-box"><i class="fas fa-search"></i><input type="text" id="sb" placeholder="Filtrar nesta lista..." oninput="filter()"></div>
                ${currentTable === 'artigo' ? `<select class="filter-select" id="fy" onchange="filter()"><option value="">Todos os Anos</option>${years.map(y => `<option value="${y}">${y}</option>`).join('')}</select>` : ''}
            </div>
            <div id="results"></div><div id="pag"></div>`;
        drawTable();
    }

    function filter() {
        const q = document.getElementById('sb').value.toLowerCase();
        const y = document.getElementById('fy')?.value || '';
        filteredData = allData.filter(d => (d.titulo || d.nome || d.palavras_chaves || d.referencia || "").toLowerCase().includes(q) && (y === '' || String(d.ano) === y));
        currentPage = 1; drawTable();
    }

    function drawTable() {
        const res = document.getElementById('results');
        const items = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
        let html = `<div class="nexus-table">`;
        if (currentTable === 'artigo') {
            html += `<div class="grid-header cols-artigo"><div>Título</div><div>Ano</div><div>Cits.</div><div>ISSN</div><div>Vol/Iss</div><div>Tipo</div></div>`;
            items.forEach((item, i) => {
                html += `
                <div class="grid-item cols-artigo" onclick="toggle('p-${i}')">
                    <div class="cell-title">${item.titulo}</div><div class="cell">${item.ano}</div><div class="cell" style="font-weight:800; color:var(--primary)">${item.qtd_citacao || 0}</div>
                    <div class="cell"><small>${item.issn || '-'}</small></div><div class="cell"><small>${item.volume || '-'}/${item.issue || '-'}</small></div>
                    <div class="cell"><span class="badge">${item.tipo_documento || 'Artigo'}</span></div>
                </div>
                <div id="p-${i}" class="expand-panel"><div class="details-box">
                    <h3>Abstract:</h3><p style="text-align:justify; line-height:1.7; color:#475569;">${item.resumo || 'Nenhum abstract disponível.'}</p>
                    <hr style="border:0; border-top:1px solid #eee; margin:20px 0">
                    <strong>DOI:</strong> ${item.doi || 'N/A'} <br>
                    <a href="${item.link || 'https://doi.org/'+item.doi}" target="_blank" class="btn-web"><i class="fas fa-external-link"></i> Ver no Scopus</a>
                </div></div>`;
            });
        } else {
            html += `<div class="grid-header cols-simples"><div>Descrição</div><div>ID Nexus</div></div>`;
            items.forEach(item => {
                html += `<div class="grid-item cols-simples"><div class="cell" style="font-weight:600">${item.nome || item.palavras_chaves || item.referencia}</div><div class="cell" style="color:var(--text-muted); font-size:0.8rem">#${item.id}</div></div>`;
            });
        }
        res.innerHTML = html + `</div>`;
        drawPag();
    }

    function drawPag() {
        const p = document.getElementById('pag'); const total = Math.ceil(filteredData.length / pageSize); if (total <= 1) { p.innerHTML = ''; return; }
        let h = `<div class="pagination">`;
        for (let i = 1; i <= total; i++) {
            if (total > 8 && (i > 3 && i < total - 2)) { if (i === 4) h += `<span style="padding:10px">...</span>`; continue; }
            h += `<button class="${i === currentPage ? 'active' : ''}" onclick="currentPage=${i}; drawTable(); document.querySelector('main').scrollTop=0;">${i}</button>`;
        }
        p.innerHTML = h + `</div>`;
    }

    function toggle(id) { const el = document.getElementById(id); const active = el.classList.contains('active'); document.querySelectorAll('.expand-panel').forEach(e => e.classList.remove('active')); if (!active) el.classList.add('active'); }

    document.getElementById('csv-input').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        const main = document.getElementById('main-content');
        main.innerHTML = `<div class="loader"><div class="spinner"></div><h2>Nexus Sync: Mapeando Dados...</h2></div>`;
        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: async function(results) {
                const rows = results.data;
                const artigos = rows.map(r => ({
                    titulo: r["Title"] || r["Document Title"], ano: parseInt(r["Year"]) || 0, qtd_citacao: parseInt(r["Cited by"]) || 0, doi: r["DOI"] || "",
                    link: r["Link"] || "", resumo: r["Abstract"] || "", tipo_documento: r["Document Type"] || "", issn: r["ISSN"] || "", volume: r["Volume"] || "", issue: r["Issue"] || ""
                }));
                await _supabase.from('artigo').insert(artigos);
                let autSet = new Set(), keySet = new Set();
                rows.forEach(r => {
                    (r["Authors"] || r["Author(s)"] || "").split(';').forEach(a => { if(a.trim()) autSet.add(a.trim()) });
                    (r["Author Keywords"] || "").split(';').forEach(k => { if(k.trim()) keySet.add(k.trim()) });
                });
                await _supabase.from('autor').upsert([...autSet].map(n => ({ id: n.replace(/[^a-z0-9]/gi,'_').toLowerCase(), nome: n, nomecompleto: n })));
                await _supabase.from('palavras_chaves').upsert([...keySet].map(k => ({ palavras_chaves: k })), { onConflict: 'palavras_chaves' });
                alert("Sincronização Nexus Concluída!"); loadSection('artigo', 'titulo');
            }
        });
    });

    showHome();
</script>
</body>
</html>
